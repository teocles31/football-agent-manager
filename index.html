<style>
/* Layout: marca e abas no topo, placar fixo verde embaixo, painel em grade de cartões (estilo central de jogo), modais em folha com borda dourada. */
:root{
  --bg:#e8eeeb;--surface:#f8fbf9;--surface2:#dbe6e1;--ink:#10282b;--ink2:#52696c;--line:#c3d2cc;--av:#d5e1dc;
  --pitch:#0c5a45;--pitch2:#094636;--pitch-ink:#eff7f3;--pitch-ink2:#b4d3c7;
  --gold:#f4c61f;--gold-ink:#2b2300;--good:#167a48;--warn:#a86a12;--bad:#bb3b28;--info:#2a69ad;
  --shade:rgba(8,28,30,.55);
  --f-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a1719;--surface:#11262a;--surface2:#193338;--ink:#e3eeea;--ink2:#9bb2ad;--line:#284449;--av:#1e3a3f;--pitch:#0a4335;--pitch2:#07342a;--pitch-ink:#e6f3ee;--pitch-ink2:#9cc2b4;--good:#52c68e;--warn:#e3ad52;--bad:#f17f70;--info:#72aee8;--shade:rgba(0,0,0,.66);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1719;--surface:#11262a;--surface2:#193338;--ink:#e3eeea;--ink2:#9bb2ad;--line:#284449;--av:#1e3a3f;--pitch:#0a4335;--pitch2:#07342a;--pitch-ink:#e6f3ee;--pitch-ink2:#9cc2b4;--good:#52c68e;--warn:#e3ad52;--bad:#f17f70;--info:#72aee8;--shade:rgba(0,0,0,.66);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink2)}.small{font-size:13px}.grow{flex:1 1 180px;min-width:0}
.lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);font-weight:600}
/* placar */
.topo{position:sticky;top:0;z-index:9;background:var(--pitch);color:var(--pitch-ink);padding-top:env(safe-area-inset-top,0px)}
#marca{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.placar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--pitch);color:var(--pitch-ink);border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 28px -14px rgba(0,0,0,.6)}
.placar .wrap{display:flex;align-items:center;gap:8px 20px;padding-block:9px}
.placar:empty,.placar .wrap:empty{display:none}
.marca{min-width:0;flex:0 1 auto}.marca h1{white-space:nowrap}.marca h1{font-size:25px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.marca p{font-size:12.5px;color:var(--pitch-ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;flex:1 1 auto}
.stat{display:flex;flex-direction:column;min-width:0}.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--pitch-ink2)}
.stat b{font-family:var(--f-d);font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}.stat b small{font-size:13px;opacity:.7}
.stat b.neg{color:#ffb3a6}
.dots{display:inline-flex;gap:4px;align-items:center;height:22px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--gold)}.dots i.on{background:var(--gold)}
.wins{display:flex;gap:6px;flex-wrap:wrap}
.janela{font-family:var(--f-d);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--pitch-ink2);color:var(--pitch-ink2);white-space:nowrap}
.janela.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{background:var(--pitch2)}.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--pitch-ink2);font-family:var(--f-d);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:9px 12px 6px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--pitch-ink)}.tabs button[aria-current="true"]{color:var(--pitch-ink);border-bottom-color:var(--gold)}
.tabs em{font-style:normal;background:var(--gold);color:var(--gold-ink);border-radius:9px;padding:0 6px;font-size:12px;margin-left:5px}
main.wrap{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}.sec-h h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}.sec-h p{color:var(--ink2);font-size:13.5px}
/* botões, chips */
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.btn.big{font-family:var(--f-d);font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:8px 18px}
.btn.sm{padding:3px 9px;font-size:12.5px}.btn.danger{color:var(--bad)}.btn small{font-weight:500;opacity:.75}
.btn.ghost{background:transparent;color:var(--pitch-ink2);border-color:var(--pitch-ink2);font-size:12.5px;padding:5px 10px}.btn.ghost:hover:not(:disabled){color:var(--pitch-ink);border-color:var(--pitch-ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.info{color:var(--info);border-color:var(--info)}
.lnk{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--ink)}.lnk.club{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600}.lnk.club:hover span{text-decoration:underline}
.crest{flex:none;vertical-align:middle}.av{flex:none;border-radius:10px;display:block}
.ovr{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:26px;padding:0 5px;border-radius:5px;font-family:var(--f-d);font-weight:700;font-size:17px;background:var(--surface2);font-variant-numeric:tabular-nums}
.ovr.t3{background:#cfe6da;color:#0f4a33}.ovr.t2{background:#bfe0f2;color:#0b3d5b}.ovr.t1{background:var(--gold);color:var(--gold-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ovr.t3{background:#1f4a39;color:#bfe9d3}:root:not([data-theme="light"]) .ovr.t2{background:#1c4058;color:#cfe8f7}}
.ovr.xl{font-size:32px;height:48px;min-width:58px}
.res{font-family:var(--f-d);font-weight:700;font-size:13px;letter-spacing:.04em;padding:0 6px;border-radius:3px;color:#fff;white-space:nowrap}.res.V{background:var(--good)}.res.E{background:#7a8b88}.res.D{background:var(--bad)}
.rt{font-family:var(--f-d);font-weight:700;font-size:13px;padding:0 5px;border-radius:3px;background:var(--surface2)}.rt.hi{background:var(--good);color:#fff}.rt.lo{background:var(--bad);color:#fff}
/* cartões e painel */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.card-h h2{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dash>.card{grid-column:span 6}.dash>.office{grid-column:span 12}
@media (max-width:900px){.dash>.card{grid-column:span 12}}
.office-top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}.office-top .big{font-family:var(--f-d);font-size:26px;display:block;line-height:1.1}
.repbar{flex:1 1 260px}.repbar div{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:4px}.repbar i{display:block;height:100%;background:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:9px 13px;min-width:0}.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.kpi b{display:block;font-family:var(--f-d);font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi small{color:var(--ink2);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column}.list>*{padding:8px 2px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.list>*:first-child{border-top:0}
.card.list{padding-block:4px}.list.scroll{max-height:46vh;overflow-y:auto}
.fx-row .date{display:flex;flex-direction:column;font-size:11px;text-transform:uppercase;color:var(--ink2);min-width:48px}.fx-row .date b{font-family:var(--f-d);font-size:15px;color:var(--ink)}
.lw-row .g{display:inline-flex;gap:4px;align-items:center;margin-right:8px;white-space:nowrap}
.steps{margin:0;padding-left:20px}.steps li{margin:3px 0}.steps li.ok{color:var(--ink2);text-decoration:line-through}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}.tbw{overflow-x:auto}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);text-align:left;font-weight:600}
th,td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}thead th{border-top:0}td.r,th.r{text-align:right}
tr.mine td{background:color-mix(in srgb,var(--gold) 14%,transparent);font-weight:600}
tr.z1 td:first-child{box-shadow:inset 3px 0 0 var(--good)}tr.z2 td:first-child{box-shadow:inset 3px 0 0 var(--bad)}tr.z3 td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.mini td,table.mini th{padding:4px 6px}
.form{display:inline-flex;gap:2px}.form i{font-style:normal;font-family:var(--f-d);font-weight:700;font-size:11px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;color:#fff}
.form i.V{background:var(--good)}.form i.E{background:#7a8b88}.form i.D{background:var(--bad)}
/* carrossel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.ncard{flex:0 0 calc((100% - 48px)/5);scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.ncard>div{display:flex;justify-content:space-between;gap:6px;align-items:center}.ncard p{font-size:13.5px}
.ncard.good{border-top-color:var(--good)}.ncard.bad{border-top-color:var(--bad)}.ncard.warn{border-top-color:var(--warn)}.ncard.info{border-top-color:var(--info)}
@media (max-width:1000px){.ncard{flex-basis:calc((100% - 24px)/3)}}@media (max-width:600px){.ncard{flex-basis:78%}}
/* figurinhas */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.fig{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.fig-n{flex:0 0 86px;background:var(--pitch);color:var(--pitch-ink);display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:3px}
.fig-n b{font-family:var(--f-d);font-size:36px;line-height:.95;font-weight:700}.fig-n span{font-family:var(--f-d);font-weight:600;letter-spacing:.1em;font-size:14px;background:var(--gold);color:var(--gold-ink);padding:0 7px;border-radius:2px}
.fig-n small{font-size:11px;color:var(--pitch-ink2);text-align:center}
.fig-b{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}.fig-b h3{font-size:20px;text-transform:none;letter-spacing:.01em}.fig-b h3 small{font-family:var(--f-b);font-weight:500;font-size:12.5px;color:var(--ink2);margin-left:6px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meter span{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.meter div{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}.meter i.mid{background:var(--warn)}.meter i.low{background:var(--bad)}
/* ligas */
.search{display:flex;flex-direction:column;gap:6px}.search input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:420px}
.compnav{display:flex;flex-wrap:wrap;gap:10px 18px}.compnav>div{display:flex;flex-direction:column;gap:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg.sm button{padding:2px 10px;font-size:12.5px}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.lb-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}.lb-row .pos{font-family:var(--f-d);font-weight:700;width:18px;color:var(--ink2)}.lb-row .val{font-family:var(--f-d);font-size:20px}
.mrow{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.mrow .h{justify-self:end}.mrow .score{font-family:var(--f-d);font-size:18px;min-width:52px;text-align:center}
.ko{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.tie{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}.tie>span:last-child{justify-self:end}.tie b{font-family:var(--f-d);font-size:15px;text-align:center}
.tie .l{opacity:.5}.tie .w .lnk{font-weight:700}
.champ{align-items:center;text-align:center;border:2px solid var(--gold)}.champ b{font-family:var(--f-d);font-size:22px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.clubcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.clubcard:hover{border-color:var(--ink2)}.clubcard b{font-family:var(--f-d);font-size:16px}
/* mercado */
.mk-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}@media (max-width:800px){.mk-top{grid-template-columns:1fr}}
.bars .bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px}.bars .bar div{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}.bars .bar i{display:block;height:100%;background:var(--pitch)}
.mvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.mv{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.route{display:flex;align-items:center;gap:5px;font-size:12.5px;flex-wrap:wrap;margin-top:3px}.route i{font-style:normal;color:var(--ink2)}
.fee{display:flex;flex-direction:column;align-items:flex-end;text-align:right}.fee b{font-family:var(--f-d);font-size:17px;white-space:nowrap}
/* modais */
.modal{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 24px}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);width:min(100%,640px);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.sheet.wide{width:min(100%,920px)}.sheet h2{font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600}
.pl-head,.neg-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pl-ovr{display:flex;flex-direction:column;align-items:center;gap:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:700px){.two{grid-template-columns:1fr}}
.sparks{display:flex;gap:8px;align-items:flex-end;height:70px}.sparks>div{display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end;width:34px}
.sparks i{display:block;width:100%;background:var(--info);border-radius:3px 3px 0 0;min-height:4px}.sparks i.hi{background:var(--good)}.sparks i.lo{background:var(--bad)}.sparks span{font-size:11px}
table.squad td{padding:4px 8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;white-space:normal}
.choice:hover:not(:disabled){border-color:var(--ink)}.choice:disabled{opacity:.45;cursor:not-allowed}.choice b{font-weight:600}.choice span{font-size:13px;color:var(--ink2)}
.field{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.field output{font-family:var(--f-d);font-weight:600;font-size:18px}.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--pitch)}.field small{grid-column:1/-1;color:var(--ink2);font-size:12px}
.field input[type=text]{grid-column:1/-1;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.log{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}.log p.me{color:var(--ink2)}
.gain{background:var(--surface2);border-radius:var(--r);padding:8px 12px;font-size:13.5px}.pat{letter-spacing:3px;color:var(--warn)}
.week .wk-top{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wk-top>div{background:var(--bg);padding:6px 10px;min-width:0}.wk-top span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}.wk-top b{font-family:var(--f-d);font-size:18px;white-space:nowrap}
.up{color:var(--good)}.dn{color:var(--bad)}
.wk-row{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.wk-row.good{border-left-color:var(--good)}.wk-row.bad{border-left-color:var(--bad)}.wk-row.warn{border-left-color:var(--warn)}.wk-row.own{border-left-color:var(--gold)}
.wk-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.wk-ovr{font-family:var(--f-d);font-weight:700;font-size:16px;background:var(--pitch);color:var(--pitch-ink);border-radius:3px;padding:0 6px}
.fxs{display:flex;flex-wrap:wrap;gap:5px}.wk-foot{font-size:13.5px;color:var(--ink2);font-weight:600}.okk{color:var(--good)}.nok{color:var(--bad)}
.stamp{position:absolute;right:62px;top:12px;font-family:var(--f-d);font-weight:700;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:4px;padding:0 10px;transform:rotate(-8deg)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;max-width:min(92vw,520px);text-align:center}
.loading{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px}
.ld-box{background:var(--pitch);color:var(--pitch-ink);border-bottom:4px solid var(--gold);border-radius:var(--r);width:min(100%,380px);padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ld-box .eyebrow{color:var(--pitch-ink2)}.ld-box b{font-family:var(--f-d);font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.ld-pitch{position:relative;width:100%;height:58px;border:2px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--pitch2) 0 34px,var(--pitch) 34px 68px)}
.ld-pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.35)}
.ld-pitch::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid rgba(255,255,255,.35);border-radius:50%}
.ld-ball{position:absolute;top:50%;left:6px;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 40%,#d9d9d9 41% 100%);z-index:1}
.ld-ball::after{content:"";position:absolute;inset:5px;background:#222;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}

  if(n>=1e9)return s+'R$ '+f(n/1e9,2)+' bi';if(n>=1e6)return s+'R$ '+f(n/1e6,n>=1e8?0:n>=1e7?1:2)+' mi';

function robin(ids){const t=ids.slice();if(t.length%2)t.push(-1);const n=t.length,R=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a<0||b<0)continue;m.push(r%2?[b,a]:[a,b]);}R.push(m);t.splice(1,0,t.pop());}
  return R.concat(R.map(m=>m.map(([a,b])=>[b,a])));}
function leagueDates(st,en,n,brk){const sats=[],mids=[];for(let d=st;d<=en;d++){const w=ymd(d).w;if(inR(d,brk))continue;if(w===6)sats.push(d);else if(w===3)mids.push(d);}
  if(sats.length>=n)return Array.from({length:n},(_,i)=>sats[Math.round(i*(sats.length-1)/(n-1))]);
  const k=n-sats.length,used=new Set();for(let i=0;i<k&&used.size<mids.length;i++){let j=Math.min(mids.length-1,Math.floor((i+.5)*mids.length/k));while(used.has(mids[j])&&j<mids.length-1)j++;used.add(mids[j]);}
  return sats.concat([...used]).sort((a,b)=>a-b).slice(0,n);}
const seasonLbl=(reg,Y)=>reg==='eu'?Y+'/'+String(Y+1).slice(2):String(Y);
const clubsOf=li=>G.clubs.filter(c=>c.lg===li);
function mkLeague(li,Y){const L=LG[li],cf=CAL[L.id],ids=clubsOf(li).map(c=>c.id);
  let brk=(L.reg==='eu'?EU_BREAKS:[]).concat(cf.wb).map(r=>[cd(Y,r[0]),cd(Y,r[1])]);if(L.id==='bra'&&Y%4===2)brk.push([dayOf(Y,6,Y===2026?1:8),dayOf(Y,7,Y===2026?19:14)]); /* o Brasileirão para durante a Copa do Mundo */
  const st=L.id==='bra'&&Y===2026?dayOf(2026,1,28):cd(Y,cf.st);
  const R=robin(shuffle(ids)),dates=leagueDates(st,cd(Y,cf.en),R.length,brk);
  const c={id:'L'+L.id+Y,t:'L',li,Y,name:L.n,sh:L.s,lbl:seasonLbl(L.reg,Y),reg:L.reg,rounds:R.map((m,i)=>({d:dates[i],m:m.map(x=>[x[0],x[1],-1,-1])})),tab:{}};
  ids.forEach(id=>c.tab[id]=[0,0,0,0,0,0,0]);return c;}
function mkKO(id,t,name,sh,Y,reg,li,stages,pool){return{id,t,li,Y,name,sh,lbl:seasonLbl(reg,Y),reg,ko:stages.map(s=>({n:s[0],d:s[1].map(x=>cd(Y,x)),ties:null})),pool,win:null};}
function mkCup(li,Y,teams,stages){const L=LG[li];stages=stages||CAL[L.id].cup;let st=stages;if(teams.length<=16)st=stages.filter(s=>s[0]!=='Fase preliminar');
  const c=mkKO('C'+L.id+Y,'K',L.cup,L.cup,Y,L.reg,li,st,teams);if(c.ko[0].n==='Fase preliminar')c.ko[0].pre=1;return c;}
function mkUCL(Y,teams){const c=mkKO('UCL'+Y,'U','Champions League','Champions',Y,'eu',null,UCL_CAL.ko,[]);c.teams=teams;c.tab={};teams.forEach(id=>c.tab[id]=[0,0,0,0,0,0,0]);
  const met=new Set(),home={};teams.forEach(t=>home[t]=0);c.rounds=UCL_CAL.lp.map(dd=>{let m=null;
    for(let tr=0;tr<300&&!m;tr++){const pool=shuffle(teams.slice()),out=[];let ok=true;while(pool.length){const a=pool.shift();const j=pool.findIndex(b=>!met.has(a<b?a+'-'+b:b+'-'+a));if(j<0){ok=false;break;}out.push([a,pool.splice(j,1)[0]]);}if(ok)m=out;}
    if(!m){const pool=shuffle(teams.slice());m=[];while(pool.length)m.push([pool.shift(),pool.shift()]);}
    return{d:cd(Y,dd),m:m.map(([a,b])=>{met.add(a<b?a+'-'+b:b+'-'+a);const h=home[a]<=home[b]?a:b,aw=h===a?b:a;home[h]++;return[h,aw,-1,-1];})};});return c;}
function mkLIB(Y,teams,fromKO){if(fromKO){return mkKO('LIB'+Y,'B','Libertadores','Libertadores',Y,'sa',null,LIB_CAL.ko,teams);}
  const c=mkKO('LIB'+Y,'B','Libertadores','Libertadores',Y,'sa',null,LIB_CAL.ko,[]);c.teams=teams;c.tab={};teams.forEach(id=>c.tab[id]=[0,0,0,0,0,0,0]);

  for(let g=0;g<8;g++)c.groups.push(pots.map(p=>p[g]));
  c.rounds=LIB_CAL.gp.map(dd=>({d:cd(Y,dd),m:[]}));c.groups.forEach(gr=>{robin(gr).forEach((ms,i)=>ms.forEach(([a,b])=>c.rounds[i].m.push([a,b,-1,-1])));});return c;}

/* homônimos: na base de dados, alguns xarás de craques herdaram a nota do craque (um goleiro "João Pedro" com a nota do
   atacante do Chelsea). Fica com a nota quem joga no clube mais forte; os xarás voltam ao nível do próprio clube. */
function fixHomonyms(){const by={};allP().forEach(p=>{if(p.real&&p.club!=null)(by[p.name]||(by[p.name]=[])).push(p);});

function play(comp,m,neutral,phase,day,pre){const H=G.clubs[m[0]],A=G.clubs[m[1]];const lh=lineup(H.id),la=lineup(A.id);

  {const bst=r1.concat(r2).reduce((b,x)=>!b||x[1]>b[1]?x:b,null);if(bst){const ss=bst[0].st[comp.id];if(ss)ss[9]=(ss[9]||0)+1;}}

    if(rt>=7.5)p.fame=clamp(p.fame+(LG[c.lg].fame*.25)*(p.ag===0?1+G.staff.assessor*.25+offL('midia')*.2:1)*(p.trait==='timido'?.5:1)*(p.ag===0&&mind('est')?1.25:1)*(p.ag===0?1+.05*bizLv('marca'):1),0,100);}));}
function statLine(comp,lu,gf,ga){const all=lu.xi.concat(lu.subs),ng=new Map(),na=new Map(),out=[];

  if(c.t==='U'&&k===0){const o=sortedTab(c);c.top8=o.slice(0,8);st.ties=[];for(let i=0;i<8;i++)st.ties.push(tie(o[8+i],o[23-i]));c.pool=[];return;}

/* ================= MERCADO DAS IAs =================
   Calibrado com 3 temporadas de transferências do Transfermarkt (2023–2025, 6 ligas, ~7.600 chegadas):
   - mercado interno domina (Brasil 57%, Itália 49%, Espanha 47%, Inglaterra 42%, França 30%);
   - Brasil: 73% das chegadas são brasileiros, 24% sul-americanos, só 3% europeus; quem vem da Europa é

   - Europa compra do Brasil/América do Sul sobretudo jovens (48% com até 20 anos);
   - França compra muitos africanos (31%); Portugal/Holanda/Bélgica são vitrines de sul-americanos;
   - taxa paga ≈ 1,0–1,3× o valor de mercado; uma contratação raramente passa de 12% do valor do elenco do comprador;
   - ~30% das chegadas são empréstimos (jovens sem espaço indo para clubes menores do mesmo país). */

function needOf(c){const sq=squad(c.id),cnt={};sq.forEach(p=>cnt[p.pos]=(cnt[p.pos]||0)+1);

function wouldBuy(c,p){const src=club(p),avg=teamStr(c.id),need=starterOvr(c.id,p.pos),pc=prest(c);
  const young=p.age<=21&&p.pot>=avg+3&&p.ovr>=avg-9&&pc>=80;
  const improves=p.ovr>=need+1&&p.ovr<=avg+7&&p.age<=32;
  if(!young&&!improves)return false;
  if(src){const ps=prest(src),starter=squad(src.id).filter(x=>x.pos===p.pos&&x.ovr>p.ovr).length<FORM[p.pos];

function wpick(a,wf){let t=0;const ws=a.map(x=>{const w=Math.max(0,wf(x));t+=w;return w;});if(t<=0)return null;let r=Math.random()*t;for(let i=0;i<a.length;i++){r-=ws[i];if(r<=0)return a[i];}return a[a.length-1];}
function aiLoans(c){/* clube grande empresta jovem sem espaço para clube menor do mesmo país */
  const avg=teamStr(c.id);const kids=squad(c.id).filter(p=>p.ag!==0&&!p.loan&&p.age<=23&&p.ovr<78&&(p.loanN||0)<2&&p.ovr<=avg-4&&p.ovr>=avg-14&&(!p.movedW||G.d-p.movedW>200));if(!kids.length)return;
  const p=pick(kids),end=regOf(c)==='eu'?alignCE(curMonth(),'eu'):Math.floor(curMonth()/12)*12+11;if(p.ce<end)return;
  /* destino: quase sempre o mesmo país; às vezes outra liga da mesma região (as cinco grandes emprestam para Portugal, Holanda, Bélgica) */
  const z=zoneOf(c),near=d=>d.cn===c.cn?1:(zoneOf(d)===z||(z==='T5'&&zoneOf(d)==='EU'))?.3:0;
  const dest=G.clubs.filter(d=>d.id!==c.id&&!isOwn(d)&&near(d)>0&&(d.li||0)<3&&prest(d)<prest(c)&&p.ovr>=teamStr(d.id)-5&&roomFor(d,p.pos)&&winOpen(regOf(d)));
  const d=wpick(dest,d=>near(d)/(1+Math.abs(p.ovr-teamStr(d.id))));if(!d)return;
  p.loanN=(p.loanN||0)+1;p.loan={from:c.id,opt:false,fee:0,end};doTransfer(p,d,0,'empréstimo');c.lo=(c.lo||0)+1;d.li=(d.li||0)+1;}
function aiMarket(){const free=allP().filter(p=>p.club==null&&p.ag!==0&&!G.prospects.includes(p.id));let pool=null;
  /* jogador bom sem contrato não fica parado: assina de graça com um clube à altura, em qualquer época do ano */
  free.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,20).forEach(p=>{if(Math.random()>.15)return;
    const cs=G.clubs.filter(c=>!isOwn(c)&&roomFor(c,p.pos)&&(winOpen(regOf(c))||p.ovr>=80)&&p.ovr>=starterOvr(c.id,p.pos)-2&&p.ovr<=teamStr(c.id)+8&&fitW(c,p)>.08);
    const c=wpick(cs,c=>fitW(c,p)*Math.pow(Math.max(1,prest(c)-55),2));if(c){free.splice(free.indexOf(p),1);doTransfer(p,c,0,'livre');}});
  for(const c of shuffle(G.clubs.slice())){if(isOwn(c))continue;const sq=squad(c.id);
    if(sq.length<21&&free.length){const nd=needOf(c),fs=free.filter(p=>p.pos===nd.pos&&roomFor(c,p.pos)&&p.ovr>=teamStr(c.id)-12&&fitW(c,p)>.08);
      const cand=wpick(fs.sort((a,b)=>b.ovr-a.ovr).slice(0,6),p=>fitW(c,p)*(p.ovr-teamStr(c.id)+14));
      if(cand){free.splice(free.indexOf(cand),1);doTransfer(cand,c,0,'livre');continue;}}
    if(squad(c.id).length<20){genFor(c,needOf(c).pos,squad(c.id).length<18?'starter':'youth');continue;}
    if(!winOpen(regOf(c)))continue;
    /* elenco acima do limite na posição: o clube cede um excedente por vez durante a janela */
    if(Math.random()<.3){let w=null,wx=0;POS.forEach(pos=>{const x=posCnt(c,pos)-POS_MAX[pos];if(x>wx){wx=x;w=pos;}});if(w)shedOne(c,w);}
    if((c.lo||0)<4&&Math.random()<.65)aiLoans(c);
    /* jogador livre também reforça elenco: quem está sem contrato e serve ao banco assina de graça */
    if(free.length&&sq.length<27&&(c.arr||0)<5&&Math.random()<.03){const nf=needOf(c),lim=starterOvr(c.id,nf.pos)-5,fs=free.filter(p=>p.pos===nf.pos&&roomFor(c,p.pos)&&p.ovr>=lim&&p.ovr<=teamStr(c.id)+5&&fitW(c,p)>.08);
      const fa=wpick(fs.sort((a,b)=>b.ovr-a.ovr).slice(0,6),p=>fitW(c,p)*(p.ovr-lim+2));if(fa){free.splice(free.indexOf(fa),1);doTransfer(fa,c,0,'livre');continue;}}
    if((c.arr||0)>=5||Math.random()>.3)continue;
    const nd=needOf(c),pc=prest(c),cap=feeCap(c);if(cap<=0)continue;
    pool=pool||allP().filter(p=>p.club!=null&&p.ag!==0&&!p.loan&&!p.injury&&settled(p)&&!isOwn(club(p)));
    const cands=pool.filter(p=>p.club!=null&&!p.loan&&p.club!==c.id&&p.pos===nd.pos&&(roomFor(c,p.pos)||p.ovr>=starterOvr(c.id,p.pos)+3)&&wouldBuy(c,p));if(!cands.length)continue;
    const opts=[];for(const p of cands){const src=club(p),fee=nice(value(p)*rnd(.95,1.3)*(prest(src)>pc?1.15:1)*SELL_F[zoneOf(src)]);if(fee>cap)continue;
      const fw=fitW(c,p);if(fw<.03)continue;const q=p.ovr-starterOvr(c.id,p.pos)+(p.age<=21?(p.pot-p.ovr)*.4:0)-(p.age>=30?(p.age-29):0)+4;if(q<=0)continue;opts.push({p,fee,w:fw*q*q});}
    if(!opts.length)continue;opts.sort((a,b)=>b.w-a.w);const o=wpick(opts.slice(0,12),x=>x.w);if(!o)continue;
    doTransfer(o.p,c,o.fee,'');pool.splice(pool.indexOf(o.p),1);
    shedAfterBuy(c,o.p);}}

/* ================= TÉCNICOS =================
   Nomes reais (Transfermarkt). Cada técnico tem estilo de jogo e personalidade, que mexem no resultado em campo.
   A demissão não é sorteio: depende de três confianças (diretoria, torcida e vestiário), que sobem e descem
   conforme o resultado de cada jogo comparado com o que se esperava do elenco. */
const STYLES={ofe:['Ofensivo','mais gols a favor e também contra'],pos:['Posse de bola','rende mais quando o elenco é superior'],con:['Contra-ataque','cresce contra adversário mais forte'],ret:['Retranca','jogos de poucos gols'],pre:['Pressão alta','rende com elenco jovem, sofre com veteranos'],equ:['Equilibrado','sem ponto forte nem fraco']};
const PERS={mot:['Motivador','o time reage depois de uma derrota'],dis:['Disciplinador','a diretoria banca, o vestiário sente a cobrança'],pai:['Paizão','vestiário fechado com ele'],est:['Estrategista','cresce em mata-mata e contra time maior'],exp:['Explosivo','vai do céu ao inferno com a torcida'],frm:['Formador','desenvolve e escala os jovens']};
const newCf=()=>({d:62,t:60,e:62});
function coachUsed(){const s=new Set((G.fc||[]).map(k=>k.n));G.clubs.forEach(c=>{if(c.coach)s.add(c.coach.n);});return s;}
/* origem dos nomes fictícios, na ordem da lista: BR, SA (América do Sul), PT ou EU */
const CN_G='BR,BR,BR,BR,BR,BR,BR,BR,EU,EU,EU,EU,EU,EU,EU,EU,EU,EU,PT,PT,SA,SA,SA,EU,EU,EU,EU,EU,PT,BR,EU,EU,EU,SA,SA,EU,EU,BR,SA,EU'.split(',');
/* quem cada região contrata: no Brasil, quase só brasileiros, sul-americanos e portugueses; na Europa, quase nenhum brasileiro */
const COACH_W={BR:{BR:1,SA:.5,PT:.45,EU:.02},SA:{SA:1,BR:.25,PT:.1,EU:.02},EU:{EU:1,PT:.9,SA:.25,BR:.03}};
const coachZone=c=>!c?'EU':c.cn==='Brasil'?'BR':regOf(c)==='sa'?'SA':'EU';
const coachW=(c,k)=>COACH_W[coachZone(c)][k.ng||'EU']*(c&&c.cn==='Portugal'&&k.ng==='PT'?3:1);
function newCoach(s,c){const used=G&&G.clubs?coachUsed():new Set(),z=coachZone(c),ok=COACH_NAMES.map((n,i)=>({n,g:CN_G[i]||'EU'})).filter(x=>COACH_W[z][x.g]>=.25);
  const fresh=ok.filter(x=>!used.has(x.n)),ch=fresh.length?pick(fresh):pick(ok.filter(x=>x.g===(z==='EU'?'EU':z))||ok);
  return{n:fresh.length?ch.n:ch.n.split(' ')[0]+' '+pick(['Sampaio','Rezende','Barcellos','Quintana','Moretti','Lindqvist','Aguirre','Hartmann','Teles','Navarro'])+(Math.random()<.3?' Jr.':''),ng:ch.g,r:clamp(Math.round(s+rnd(-5,4)),58,92),st:pick(Object.keys(STYLES)),pe:pick(Object.keys(PERS)),age:ri(38,62),since:G?G.d:0,g:0,pts:0};}
/* contratação: primeiro olha quem está livre no mercado e combina com o tamanho do clube */
function mkCoach0(s,c){const fc=(G&&G.fc)||[],fit=fc.filter(k=>Math.abs(k.r-s)<=6&&coachW(c,k)>=.2);
  if(fit.length&&Math.random()<.8){const k=wpick(fit,x=>coachW(c,x)/(1+Math.abs(x.r-s)));fc.splice(fc.indexOf(k),1);k.since=G.d;k.g=0;k.pts=0;return k;}
  return newCoach(s,c);}
const coachB=c=>(c.coach.r-75)/6;
const coachScore=c=>c.cf.d*.45+c.cf.t*.3+c.cf.e*.25;
const coachPct=k=>k.g?Math.round((k.pts||0)/(k.g*3)*100):null;
function applyRealCoaches(keepOwn){G.fc=G.fc||[];const placed=new Set();
  G.clubs.forEach(c=>{c.cf=c.cf||newCf();c.sack=c.sack||0;const row=COACH_REAL[c.n];if(!row||(keepOwn&&isOwn(c)))return;const [n,age,ng,since,st,pe,r]=row.split(',');
    let sd=G.d-200;if(since){const [y,m]=since.split('-');sd=dayOf(+y,+m,15);}
    c.coach={n,age:+age||50,ng,st,pe,r:+r||clamp(Math.round(c.str+(hash(n)%7)-3),60,90),since:Math.min(sd,G.d),g:0,pts:0,real:1};placed.add(n);
    const ten=(G.d-c.coach.since)/365;c.cf={d:clamp(60+ten*5,55,80),t:60,e:clamp(60+ten*2,58,70)};});
  /* técnicos conhecidos que estão sem clube entram no mercado */
  COACH_FREE.split(';').forEach(row=>{const [n,age,st,pe,r,ng]=row.split(',');if(n&&!placed.has(n)&&!G.fc.some(k=>k.n===n))G.fc.push({n,age:+age,st,pe,r:+r,ng,since:G.d,g:0,pts:0,real:1});});
  G.clubs.forEach(c=>{const k=c.coach;if(!k.st){k.st=Object.keys(STYLES)[hash(k.n)%6];k.pe=Object.keys(PERS)[hash(k.n+'p')%6];}if(k.since==null)k.since=G.d-120;});G.rc=1;}
/* efeito de estilo e personalidade em uma partida */
function styleFx(H,A,lh,la,ko){let d=0,h=1,a=1;
  const one=(c,me,op,sg)=>{const k=c.coach,df=me.str-op.str,last=c.fm.slice(-1);let x=0;
    if(k.st==='pos')x+=df>=1.5?1:df<=-3?-.6:0;else if(k.st==='con')x+=df<0?1.3:df>=3?-.5:0;else if(k.st==='pre')x+=me.age<=26.5?1:me.age>=29?-.7:.2;else if(k.st==='equ')x+=.3;
    if(k.pe==='mot'&&last==='D')x+=.9;if(k.pe==='est'&&(ko||df<0))x+=.8;if(k.pe==='exp')x+=last==='V'?.6:last==='D'?-.5:0;
    x+=((c.cf?c.cf.e:58)-58)/30;d+=sg*x;
    const m=k.st==='ofe'?[1.13,1.1]:k.st==='ret'?[.86,.82]:[1,1];if(sg>0){h*=m[0];a*=m[1];}else{a*=m[0];h*=m[1];}};
  one(H,lh,la,1);one(A,la,lh,-1);return{d,h,a};}
/* depois do jogo: resultado contra a expectativa mexe nas três confianças */
function coachAfter(c,f,a,d){const k=c.coach,cf=c.cf||(c.cf=newCf());const e=1/(1+Math.exp(-d/7)),x=(f>a?1:f<a?0:.42)-e;
  const br=regOf(c)==='sa'?1.6:1.1,ex=k.pe==='exp'?1.5:1;
  cf.t=clamp(cf.t+x*9*ex*br+(f-a>=3?2:a-f>=3?-3:0),0,100);
  cf.d=clamp(cf.d+x*5.5*br*(k.pe==='dis'?.8:1),0,100);
  cf.e=clamp(cf.e+x*4.5+(k.pe==='pai'?.35:k.pe==='mot'?.25:k.pe==='dis'?-.2:0),0,100);
  k.g=(k.g||0)+1;k.pts=(k.pts||0)+(f>a?3:f===a?1:0);}
function swapCoach(c,k){const old=c.coach;c.coach=k;k.since=G.d;k.g=0;k.pts=0;c.cf=newCf();c.fm='';
  if(old){old.r=Math.max(58,old.r-(Math.random()<.5?1:0));G.fc=G.fc||[];G.fc.push(old);if(G.fc.length>45){const i=G.fc.findIndex(x=>!x.real);G.fc.splice(i<0?0:i,1);}}return old;}
function sackCoach(c,endSeason){const cf=c.cf,old=c.coach,pct=coachPct(old),g=old.g||0;
  const why=cf.d<=cf.t&&cf.d<=cf.e?'a diretoria perdeu a confiança':cf.t<=cf.e?'a torcida não aguentava mais':'o vestiário se voltou contra ele';
  const k=mkCoach(c.str+1,c);swapCoach(c,k);c.sack=(c.sack||0)+1;G.csack=(G.csack||0)+1;
  if(!G._pre)news('O '+c.n+' demitiu '+old.n+(g?' depois de '+g+' jogos ('+pct+'% de aproveitamento)':'')+(endSeason?' no balanço da temporada':'')+': '+why+'. '+k.n+' ('+STYLES[k.st][0].toLowerCase()+') assume.','clube');
  if(k.ex&&!G._pre){addRep(1);news('Seu ex-cliente '+k.n+' é o novo técnico do '+c.n+'. A porta desse clube ficou mais aberta para você.','agencia');}}
function aiCoaches(){
  /* uma vez por mês a diretoria olha a tabela: posição contra o que o elenco deveria entregar */
  if(ymd(G.d).dd<=7)for(let li=0;li<6;li++){const L=curLeague(li);if(!L)continue;const played=L.rounds.filter(r=>r.done).length;if(played<6||played>=L.rounds.length)continue;

function enroll(sk){const me=G.me,l=me[sk],t=TIERS[l];if(!t||me.course)return;
  if(G.d<me.next){toast('Você ainda não pode se matricular: a próxima matrícula abre em '+fdate(me.next,true)+'.');return;}

  G.money-=t.cost;me.course={sk,start:G.d,end:G.d+t.w*7};me.next=G.d;const S=SKILLS.find(s=>s.id===sk);

/* ================= CLUBE: DOIS CAMINHOS ATÉ O COMANDO =================
   Como funciona no futebol de verdade:
   - Associação (maioria no Brasil, Real Madrid, Barcelona, Athletic, Osasuna): não existe ação à venda. Manda quem vence a
     eleição dos sócios. O caminho é político: sócio, conselheiro, diretor, presidente. Só depois de virar SAF dá para ter dono.
   - Clube-empresa / SAF (Inglaterra, Itália, França, parte da Espanha, Botafogo, Cruzeiro, Bahia, Vasco...): tem capital em ações.
     Quem junta 51% manda. Fatias menores dão dividendos, cadeira no conselho (10%) e poder de veto (25%).
   - Alemanha (regra 50+1): investidor fica no máximo com 49%; o comando é sempre dos sócios, pela eleição. */
const SAF_BR=['Cruzeiro','Botafogo','Bahia','Atlético-MG','Vasco da Gama','Red Bull Bragantino','Coritiba'];
const SOCIOS_ES=['Real Madrid','Barcelona','Athletic Bilbao','Osasuna'];
const EXC_DE=['Bayer Leverkusen','RB Leipzig'];
function gov(c){if(c.saf)return'saf';const id=LG[c.lg].id;if(id==='bra')return SAF_BR.includes(c.n)?'saf':'assoc';if(id==='esp')return SOCIOS_ES.includes(c.n)?'assoc':'saf';if(id==='ger')return EXC_DE.includes(c.n)?'saf':'50+1';if(id==='xsa')return'assoc';return'saf';}
const GOV_N={saf:['Clube-empresa','info'],assoc:['Associação de sócios','good'],'50+1':['Regra 50+1','warn']};
const POL=[null,{n:'Sócio'},{n:'Conselheiro',wk:12,rep:12,infl:25},{n:'Diretor',wk:16,rep:28,infl:50},{n:'Presidente',rep:35,infl:60}];
const shareCap=c=>gov(c)==='50+1'?49:100;
const sharePx=(c,pct)=>nice(clubPrice(c)/100*(pct>=30?1.2:pct>=10?1.08:1));
const joinFee=c=>nice(Math.max(300,wageRef(62,c.lg)*.3));
const polDue=c=>nice(Math.max(50,wageRef(60,c.lg)*.02));
const dirPay=c=>nice(wageRef(68,c.lg)*.2);
const donAmt=c=>nice(Math.max(5000,clubPrice(c)*.0004));
const campCost=c=>nice(clubPrice(c)*.0015);
const safCost=c=>nice(clubPrice(c)*.51*.7);
function clubPull(c){return(G.inv&&G.inv.cid===c.id&&G.inv.pct>=10?.15:0)+(G.pol&&G.pol.cid===c.id?[0,0,.08,.2][G.pol.rk]:0)+(c.coach&&c.coach.ex?.1:0)+((c.exd||0)>G.d?.12:0);}
function electionDay(c){const sa=regOf(c)==='sa';for(let y=2026;y<2110;y++){if((y+c.id)%3)continue;const d=dayOf(y,sa?12:6,10);if(d>=G.d)return d;}return G.d+999;}
function canRun(c,po){const ed=electionDay(c),win=ed-G.d<=56,crise=c.cf.t<35;return{ed,win,crise,ok:(win||crise)&&(po.lost||0)<G.d&&(po.rk>=3||po.infl>=60)&&G.rep>=35};}
function takeControl(c,role,pct){G.own={cid:c.id,role,pct,base:0,est:0,mood:clamp(Math.round(c.cf.t)+(role==='pres'?8:0),40,78),wd:0,rev:nice((wageBill(c)+coachWage(c))*1.08),cands:genCoaches(c),naming:false,evCool:G.d+28,term:role==='pres'?G.d+156*7:0};
  ownInit();spmOffers();G.inv=null;if(G.pol&&G.pol.cid===c.id)G.pol=null;G.missions=G.missions.filter(m=>m.cid!==c.id);ui.modal=null;ui.tab='clube';addRep(role==='dono'?2:3);}
/* ---------- caminho das ações ---------- */
function buyShares(cid,lot){const c=G.clubs[cid];let iv=G.inv;if(G.own){toast('Você já comanda um clube. Só dá para ter um.');return;}
  if(gov(c)==='assoc'){toast('O '+c.n+' é uma associação: não tem ações à venda. O caminho ali é a política do clube.');return;}
  if(iv&&iv.cid!==cid){toast('Você já é acionista do '+G.clubs[iv.cid].n+'. Venda essas ações antes de investir em outro clube.');return;}
  if(G.rep<15){toast('Você ainda precisa de reputação 15 para ser aceito como investidor.');return;}
  const have=iv?iv.pct:0,capL=shareCap(c)-have,wkL=10-(iv?iv.wk||0:0);
  if(capL<=0){toast('Você já tem o máximo de ações que a regra 50+1 permite neste clube.');return;}
  if(wkL<=0){toast('O mercado só coloca 10% do clube à venda por semana. Você ainda precisa esperar a próxima.');return;}
  lot=Math.min(lot,capL,wkL);const cost=sharePx(c,have)*lot;if(G.money<cost){toast('Caixa insuficiente: '+lot+'% custa '+fmt(cost)+'.');return;}
  G.money-=cost;if(!iv)iv=G.inv={cid,pct:0,paid:0,wk:0,since:G.d,div:0};iv.pct+=lot;iv.paid+=cost;iv.wk=(iv.wk||0)+lot;
  if(iv.pct>=51){const pct=iv.pct;takeControl(c,'dono',pct);news('Você passou a ter '+pct+'% das ações do '+c.n+' e assumiu o controle do clube.','clube');
    pop({k:'good',ic:'club',wait:1600,wt:'Registrando as ações…',ti:'Você é o dono!',tx:'Com '+pct+'% das ações, o '+c.n+' agora é seu.'});save();render();return;}
  const mark=iv.pct>=25&&have<25?'Você agora tem poder de veto no conselho.':iv.pct>=10&&have<10?'Você ganhou uma cadeira no conselho.':'';
  news('Você comprou '+lot+'% das ações do '+c.n+' por '+fmt(cost)+'. Agora tem '+iv.pct+'%.'+(mark?' '+mark:''),'clube');
  pop({k:'good',ic:'money',wait:1200,wt:'Enviando a ordem de compra…',ti:'+'+lot+'% do '+c.n,tx:'Você agora tem '+iv.pct+'% do clube.'+(mark?' '+mark:''),ch:[['-'+fmt(cost),'bad'],[iv.pct+'% das ações','good']]});save();render();}
function sellShares(lot){const iv=G.inv;if(!iv)return;const c=G.clubs[iv.cid];lot=Math.min(lot,iv.pct);const v=nice(clubPrice(c)/100*lot*.97);G.money+=v;iv.paid=Math.max(0,iv.paid*(1-lot/iv.pct));iv.pct-=lot;
  news('Você vendeu '+lot+'% das ações do '+c.n+' por '+fmt(v)+'.','clube');if(iv.pct<=0)G.inv=null;
  pop({k:'info',ic:'money',wait:1100,wt:'Enviando a ordem de venda…',ti:'Ações vendidas',tx:lot+'% do '+c.n+' por '+fmt(v)+'.',ch:[['+'+fmt(v),'good']]});save();render();}
function opaCost(c){const have=G.inv&&G.inv.cid===c.id?G.inv.pct:0;return nice(clubPrice(c)/100*(51-have)*1.25);}
function opa(cid){const c=G.clubs[cid];if(G.own||gov(c)!=='saf')return;if(G.inv&&G.inv.cid!==cid){toast('Venda antes as ações do '+G.clubs[G.inv.cid].n+'.');return;}
  if(G.rep<30){toast('Uma oferta pelo controle ainda exige reputação 30.');return;}const cost=opaCost(c);if(G.money<cost){toast('Caixa insuficiente: a oferta pelo controle custa '+fmt(cost)+'.');return;}
  G.money-=cost;takeControl(c,'dono',51);news('Sua oferta pública pelo controle do '+c.n+' foi aceita: 51% das ações por '+fmt(cost)+'.','clube');
  pop({k:'good',ic:'club',wait:1800,wt:'Acionistas votando a oferta…',ti:'Oferta aceita!',tx:'Você comprou o controle do '+c.n+' com 51% das ações.',ch:[['-'+fmt(cost),'bad']]});save();render();}
function shVeto(){const iv=G.inv;if(!iv||iv.pct<25)return;const c=G.clubs[iv.cid];if((iv.vcool||0)>G.d){toast('O conselho ainda não aceita outro pedido seu. Tente depois de '+fdate(iv.vcool,true)+'.');return;}if(!useAP())return;
  if(coachScore(c)<50&&(G.d-c.coach.since)/7>=10){const old=c.coach.n;sackCoach(c,false);iv.vcool=G.d+84;pop({k:'good',ic:'coach',wait:1400,wt:'Reunião do conselho…',ti:'Técnico demitido',tx:'O conselho aceitou seu pedido: '+old+' saiu e '+c.coach.n+' assume o '+c.n+'.'});}
  else{iv.vcool=G.d+56;pop({k:'bad',ic:'no',wait:1400,wt:'Reunião do conselho…',ti:'Pedido negado',tx:'O conselho do '+c.n+' banca '+c.coach.n+'. A confiança nele ainda é alta.'});}save();render();}
/* ---------- caminho político ---------- */
function joinClub(cid){const c=G.clubs[cid];if(G.own||G.pol)return;if(gov(c)==='saf'){toast('O '+c.n+' é clube-empresa: não tem eleição de sócios. O caminho ali é comprar ações.');return;}
  const fee=joinFee(c);if(G.money<fee){toast('Caixa insuficiente para a taxa de adesão.');return;}G.money-=fee;G.pol={cid,rk:1,since:G.d,infl:5,cool:0,lost:0};
  news('Você virou sócio do '+c.n+'. O caminho até a presidência passa pelo conselho e pela diretoria.','clube');
  pop({k:'good',ic:'sign',wait:1200,wt:'Preenchendo a ficha de sócio…',ti:'Carteirinha na mão',tx:'Você agora é sócio do '+c.n+'.',ch:[['-'+fmt(fee),'bad'],['Influência 5','info']]});save();render();}
function polWork(){const po=G.pol;if(!po||!useAP())return;const g=3+G.me.rel;po.infl=clamp(po.infl+g,0,100);
  pop({k:'good',ic:'talk',wait:1100,wt:'Jantar com conselheiros…',ti:'Bastidores',tx:'Você costurou apoio dentro do '+G.clubs[po.cid].n+'.',ch:[['Influência +'+g,'good']]});save();render();}
function polDonate(){const po=G.pol;if(!po)return;const c=G.clubs[po.cid],a=donAmt(c);if(G.money<a){toast('Caixa insuficiente para a doação.');return;}G.money-=a;c.bud+=a;po.infl=clamp(po.infl+5,0,100);c.cf.t=clamp(c.cf.t+1,0,100);
  news('Você doou '+fmt(a)+' ao '+c.n+'.','clube');pop({k:'good',ic:'money',ti:'Doação feita',tx:'O '+c.n+' agradeceu em nota oficial.',ch:[['-'+fmt(a),'bad'],['Influência +5','good']]});save();render();}
function polUp(){const po=G.pol;if(!po||po.rk>=3)return;const c=G.clubs[po.cid],nx=POL[po.rk+1],wk=Math.floor((G.d-po.since)/7);
  if(wk<nx.wk){toast('Você ainda precisa de '+(nx.wk-wk)+' semana(s) como '+POL[po.rk].n.toLowerCase()+'.');return;}if(G.rep<nx.rep){toast('O cargo ainda exige reputação '+nx.rep+'.');return;}
  if(po.infl<nx.infl){toast('Você ainda precisa de influência '+nx.infl+'. Articule nos bastidores ou doe ao clube.');return;}if((po.cool||0)>G.d){toast('Você ainda precisa esperar até '+fdate(po.cool,true)+' para tentar de novo.');return;}
  if(!useAP())return;const ch=clamp(.35+(po.infl-nx.infl)/50+G.rep/250+G.me.rel*.03,.2,.95);
  if(Math.random()<ch){po.rk++;po.since=G.d;addRep(po.rk===3?1.5:.8);news('Você agora é '+nx.n.toLowerCase()+' do '+c.n+'.','clube');
    pop({k:'good',ic:'staff',wait:1500,wt:po.rk===2?'Votação no conselho…':'Reunião com o presidente…',ti:nx.n+' do '+c.n,tx:po.rk===2?'Os sócios elegeram você para o conselho deliberativo.':'O presidente chamou você para a diretoria. Você recebe '+fmt(dirPay(c))+' por semana.'});}
  else{po.infl=clamp(po.infl-5,0,100);po.cool=G.d+56;pop({k:'bad',ic:'no',wait:1500,wt:po.rk===1?'Votação no conselho…':'Reunião com o presidente…',ti:'Não foi dessa vez',tx:'Faltou apoio para virar '+nx.n.toLowerCase()+'. Você pode tentar de novo em 8 semanas.',ch:[['Influência -5','bad']]});}
  save();render();}
function elChance(c,po){return clamp(.15+po.infl/140+G.rep/250+(50-c.cf.t)/150+(po.rk===3?.1:0)+G.me.rel*.02,.05,.92);}
function polRun(){const po=G.pol;if(!po)return;const c=G.clubs[po.cid],r=canRun(c,po);if(!r.ok)return;const cost=campCost(c);if(G.money<cost){toast('Caixa insuficiente para a campanha de '+fmt(cost)+'.');return;}
  G.money-=cost;if(Math.random()<elChance(c,po)){takeControl(c,'pres',0);news('Você foi eleito presidente do '+c.n+' para um mandato de 3 anos.','clube');
    pop({k:'good',ic:'club',wait:2200,wt:'Apurando os votos dos sócios…',ti:'Presidente eleito!',tx:'Os sócios do '+c.n+' escolheram você. O mandato vai até '+fdate(G.own.term,true)+'.',ch:[['Campanha -'+fmt(cost),'bad']]});}
  else{po.infl=clamp(po.infl-15,0,100);po.lost=G.d+300;news('Você perdeu a eleição para presidente do '+c.n+'.','clube');
    pop({k:'bad',ic:'no',wait:2200,wt:'Apurando os votos dos sócios…',ti:'Derrota nas urnas',tx:'A chapa da situação venceu no '+c.n+'. Você continua no clube e pode tentar na próxima eleição.',ch:[['Influência -15','bad'],['Campanha -'+fmt(cost),'bad']]});}
  save();render();}
function polLeave(){const po=G.pol;if(!po)return;const c=G.clubs[po.cid];G.pol=null;pop({k:'warn',ic:'bin',ti:'Você saiu do clube',tx:'Você devolveu a carteirinha do '+c.n+' e perdeu a influência acumulada.'});save();render();}
/* ---------- presidente: virar SAF e comprar o controle ---------- */
function safVote(){const o=G.own,c=ownC();if(!o||o.role!=='pres')return;if(gov(c)==='50+1'){toast('Na Alemanha a regra 50+1 não permite que um dono tenha a maioria.');return;}
  if((o.safCool||0)>G.d){toast('A assembleia ainda não aceita votar de novo. Só depois de '+fdate(o.safCool,true)+'.');return;}const cost=safCost(c);if(G.money<cost){toast('Caixa insuficiente: os 51% custam '+fmt(cost)+'.');return;}
  const ch=clamp((o.mood-35)/50,.1,.95);if(Math.random()<ch){G.money-=cost;c.bud+=cost;c.saf=1;o.role='dono';o.pct=51;o.term=0;addRep(2);
    news('Os sócios do '+c.n+' aprovaram a transformação em SAF. Você comprou 51% por '+fmt(cost)+', dinheiro que entrou no caixa do clube.','clube');
    pop({k:'good',ic:'club',wait:2200,wt:'Assembleia de sócios votando…',ti:'SAF aprovada!',tx:'O '+c.n+' virou clube-empresa e você é o dono, com 51%.',ch:[['-'+fmt(cost),'bad'],['Caixa do clube +'+fmt(cost),'good']]});}
  else{o.mood=clamp(o.mood-8,0,100);o.safCool=G.d+182;news('A assembleia do '+c.n+' rejeitou a proposta de virar SAF.','clube');
    pop({k:'bad',ic:'no',wait:2200,wt:'Assembleia de sócios votando…',ti:'Proposta rejeitada',tx:'Os sócios não quiseram vender o clube. Melhore o humor da torcida e tente de novo em 6 meses.',ch:[['Torcida -8','bad']]});}
  save();render();}
function buyMore(){const o=G.own,c=ownC();if(!o||o.role!=='dono'||o.pct>=100)return;const lot=Math.min(5,100-o.pct),cost=nice(clubPrice(c)/100*lot*1.1);if(G.money<cost){toast('Caixa insuficiente: '+lot+'% custa '+fmt(cost)+'.');return;}
  G.money-=cost;o.pct+=lot;pop({k:'good',ic:'money',wait:1100,wt:'Comprando dos minoritários…',ti:'Agora você tem '+o.pct+'%',tx:'Quanto maior a sua fatia, maior a parte dos dividendos.',ch:[['-'+fmt(cost),'bad']]});save();render();}
function resign(){const o=G.own,c=ownC();if(!o||o.role!=='pres')return;G.own=null;G.pol={cid:c.id,rk:2,since:G.d,infl:35,cool:0,lost:G.d+300};G.events=G.events.filter(e=>e.pid!=null&&e.type!=='conflito');ui.modal=null;
  news('Você renunciou à presidência do '+c.n+'.','clube');pop({k:'warn',ic:'bin',ti:'Renúncia',tx:'Você deixou a presidência do '+c.n+' e voltou ao conselho.'});save();render();}
function pathWeek(){const iv=G.inv;if(iv){iv.wk=0;const c=G.clubs[iv.cid],dv=Math.round(wageBill(c)*.05*iv.pct/100);if(dv>0){G.money+=dv;G.stats.earned+=dv;iv.div=(iv.div||0)+dv;iv.last=dv;}}
  const po=G.pol;if(po){const c=G.clubs[po.cid],mine=G.clients.filter(id=>G.P[id]&&G.P[id].club===c.id).length;po.infl=clamp(po.infl+[0,.3,.5,.8][po.rk]+Math.min(.6,mine*.2),0,100);G.money+=po.rk===3?dirPay(c):-polDue(c);}
  const o=G.own;if(o&&o.role==='pres'&&G.d>=o.term){const c=ownC();
    if(o.mood>=50){o.term=G.d+156*7;addRep(1);news('Os sócios do '+c.n+' reelegeram você para mais 3 anos.','clube');pop({k:'good',ic:'club',ti:'Reeleito!',tx:'Mais um mandato de 3 anos à frente do '+c.n+'.'});}
    else{G.own=null;G.pol={cid:c.id,rk:2,since:G.d,infl:30,cool:0,lost:G.d+300};G.events=G.events.filter(e=>e.pid!=null&&e.type!=='conflito');addRep(-2);news('Fim do mandato: os sócios do '+c.n+' elegeram a oposição. Você voltou ao conselho.','clube');pop({k:'bad',ic:'no',ti:'Perdeu a reeleição',tx:'Com a torcida insatisfeita, a oposição venceu no '+c.n+'.'});}}}

function stepper(names,cur){return'<ol class="stepper">'+names.map((n,i)=>'<li class="'+(i<cur?'done':i===cur?'cur':'')+'"><i>'+(i<cur?'✓':i+1)+'</i><span>'+n+'</span></li>').join('')+'</ol>';}
function shareBar(pct,capP){return'<div class="sharebar"><div class="sb-track"><i style="width:'+Math.min(100,pct/60*100)+'%"></i>'+[[10,'Conselho'],[25,'Veto'],[51,'Controle']].map(m=>'<span class="sb-m'+(pct>=m[0]?' on':'')+(m[0]>capP?' off':'')+'" style="left:'+(m[0]/60*100)+'%"><b>'+m[0]+'%</b><em>'+m[1]+'</em></span>').join('')+'</div></div>';}
function vPolCard(){const po=G.pol,c=G.clubs[po.cid],wk=Math.floor((G.d-po.since)/7),nx=po.rk<3?POL[po.rk+1]:null,r=canRun(c,po),g=gov(c);

  let h='<section class="card c-good path"><div class="card-h"><h2>'+icoS('staff')+'Carreira política</h2><span class="chip good">'+POL[po.rk].n+'</span></div>'+
   '<div class="path-top">'+crest(c,44)+'<div class="grow"><b class="big2">'+clubLink(c)+'</b><div class="small muted">'+POL[po.rk].n+' há '+wk+' semana(s) · '+(po.rk===3?'recebe '+fmt(dirPay(c))+'/sem':'mensalidade '+fmt(polDue(c))+'/sem')+'</div></div></div>'+
   stepper(['Sócio','Conselheiro','Diretor','Presidente',g==='50+1'?'(sem dono: 50+1)':'Dono via SAF'],po.rk-1)+

  if(nx)h+='<div class="next"><span class="lbl">Para virar '+nx.n.toLowerCase()+'</span><div class="reqs">'+req(wk>=nx.wk,nx.wk+' semanas no cargo atual ('+Math.min(wk,nx.wk)+'/'+nx.wk+')')+req(G.rep>=nx.rep,'reputação '+nx.rep)+req(po.infl>=nx.infl,'influência '+nx.infl)+'</div></div>';
  h+='<div class="next"><span class="lbl">Eleição para presidente</span><div class="reqs">'+req(r.win||r.crise,r.crise&&!r.win?'crise no clube: a torcida quer eleição antecipada':'período eleitoral: 8 semanas antes de '+fdate(r.ed,true))+req(po.rk>=3||po.infl>=60,'ser diretor ou ter influência 60')+req(G.rep>=35,'reputação 35')+((po.lost||0)>G.d?req(false,'você perdeu a última eleição; volta a concorrer em '+fdate(po.lost,true)):'')+'</div>'+
   '<span class="small muted">Chance hoje: '+Math.round(elChance(c,po)*100)+'%. Torcida insatisfeita com a gestão atual ('+Math.round(c.cf.t)+'/100) ajuda a oposição. Campanha: '+fmt(campCost(c))+'.</span></div>';
  h+='<div class="acts"><button class="btn" data-a="polwork">Articular nos bastidores <small>1 ação</small></button><button class="btn" data-a="poldon"'+(G.money<donAmt(c)?' disabled':'')+'>Doar ao clube <small>'+fmt(donAmt(c))+'</small></button>'+
   (nx?'<button class="btn pri" data-a="polup">Pleitear vaga de '+nx.n.toLowerCase()+' <small>1 ação</small></button>':'')+
   '<button class="btn pri" data-a="polrun"'+(r.ok&&G.money>=campCost(c)?'':' disabled')+'>Concorrer à presidência</button><button class="btn danger" data-a="polleave">Sair do clube</button></div></section>';
  return h;}
function vInvCard(){const iv=G.inv,c=G.clubs[iv.cid],val=nice(clubPrice(c)/100*iv.pct),capP=shareCap(c),px=sharePx(c,iv.pct),left=10-(iv.wk||0),g=gov(c);
  const perk=iv.pct>=25?'Poder de veto: você pode pedir a troca do técnico ao conselho.':iv.pct>=10?'Cadeira no conselho: seus clientes são mais bem recebidos no clube.':'Acionista minoritário: você só recebe dividendos.';

   '<div class="acts">'+[1,5,10].map(l=>'<button class="btn pri" data-a="shbuy" data-c="'+c.id+'" data-l="'+l+'"'+(left<=0||iv.pct>=capP||G.money<px*Math.min(l,left,capP-iv.pct)?' disabled':'')+'>Comprar '+l+'% <small>'+fmt(px*l)+'</small></button>').join('')+

/* ---- offfield.js ---- */
/* ================= FORA DE CAMPO: REDES SOCIAIS, FINANÇAS DO ATLETA E PÓS-CARREIRA =================
   - Redes: os seguidores correm atrás da fama do jogador. A linha editorial muda o ritmo, o risco e o valor das publis,
     que caem uma vez por mês (a agência fica com a sua parte, o resto vai para o patrimônio dele).
   - Finanças: todo cliente tem patrimônio. Salário líquido entra, o padrão de vida sai. O padrão sobe rápido e desce devagar,
     então quem gasta tudo quebra quando o salário some. Um plano financeiro corta gastos, faz o dinheiro render e paga taxa de gestão.
   - Pós-carreira: a partir dos 27 anos o cliente pode se preparar para ser técnico, comentarista, empresário ou dirigente.
     Na aposentadoria ele vira ex-cliente, e o destino dele continua rendendo (ou cobrando) da agência.
   Dívida e crise de imagem só acontecem com os garotos fictícios, como os outros eventos negativos do jogo. */
PIC.phone='<rect x="8" y="3" width="12" height="22" rx="2.5"/><path d="M12 21h4"/>';
PIC.wallet='<path d="M4 9h19v14H4z"/><path d="M4 9l13-5v5M18 16h5"/>';
PIC.road='<path d="M9 25l3-22M19 25L16 3M14 6v3M14 13v3M14 20v3"/>';
/* linha editorial: [nome, descrição, ritmo de crescimento, valor das publis] */
const SMODE={disc:['Discreto','Poucos posts e nenhum risco. Cresce devagar e rende metade em publis.',.6,.5],
 fam:['Família e bastidores','Rotina, treino e família. Crescimento firme, sem sustos.',1,1],
 mar:['Vitrine de marcas','Feed pensado para patrocinador: 40% a mais em publis.',1.1,1.4],
 pol:['Resenha','Provoca, responde e viraliza. Cresce bem mais rápido, mas pode virar crise.',1.5,.9]};
const FPLAN={no:['Por conta própria','Ele gasta como quer e o dinheiro fica parado.'],
 con:['Plano conservador','Gasta 15% a menos e o patrimônio rende cerca de 5% ao ano.'],
 arr:['Plano arrojado','Gasta 15% a menos e busca 12% ao ano, com semanas de perda.']};
const PLANS={tec:['Licença de técnico','Quando parar, entra no mercado de técnicos com nota mais alta. Ex-cliente no banco abre a porta do clube.'],
 com:['Comentarista','Vira voz na TV. A agência cuida da imagem dele e recebe toda semana por 3 anos.'],
 emp:['Empresário','Investe o que guardou em negócios e você entra de sócio: dividendos por 5 anos. Exige patrimônio positivo.'],
 dir:['Dirigente','Assume um cargo no último clube. Por 4 anos, essa diretoria atende você com mais boa vontade.']};
const ROLE={apo:['Aposentado',''],olh:['Olheiro da agência','good'],tec:['Técnico','info'],com:['Comentarista','info'],emp:['Empresário','good'],dir:['Dirigente','warn']};
const SPEND={profissional:.55,leal:.65,lider:.68,timido:.6,ambicioso:.85,baladeiro:1.15};
const SAVED={profissional:.4,leal:.32,lider:.3,timido:.36,ambicioso:.18,baladeiro:.05};
function fmtN(n){n=Math.max(0,Math.round(n));const f=(v,d)=>v.toFixed(d).replace('.',',');return n>=1e6?f(n/1e6,n>=1e8?0:1)+' mi':n>=1e4?Math.round(n/1e3)+' mil':n>=1e3?f(n/1e3,1)+' mil':String(n);}
function folTarget(p,o){const c=club(p);return Math.pow(10,3+p.fame/100*5.2)*(o.sm==='pol'&&p.real?1.25:SMODE[o.sm][2])*(c?LG[c.lg].fame/3:.5)*(p.trait==='timido'?.7:1);}
function spRate(p,o){let r=(SPEND[p.trait]||.7)+p.fame/500;if(o.fp!=='no')r*=.85;if((o.aust||0)>G.d)r*=.75;return p.real?Math.min(r,.9):r;}
function offOf(p){if(p.off)return p.off;const c=club(p),w=c?p.wage:wageRef(p.ovr,0)*.3,yrs=Math.max(0,p.age-18);
  const o=p.off={sm:p.trait==='timido'?'disc':p.trait==='baladeiro'&&!p.real?'pol':'fam',fol:0,pat:Math.round(w*52*.72*yrs*(SAVED[p.trait]||.25)*rnd(.7,1.1)),ls:0,fp:'no',plan:null,planP:0,red:0};
  o.fol=Math.max(200,Math.round(folTarget(p,o)*rnd(.5,.9)));o.ls=c?w*.72*spRate(p,o):0;return o;}
function pubMonth(p,o){o=o||offOf(p);return Math.round(Math.pow(o.fol,.85)*.02*(1+.15*offL('midia')+.1*G.staff.assessor)*SMODE[o.sm][3]);}
function finHealth(o){if(o.pat<0)return 4;const yr=Math.max(150,o.ws||o.ls||150)*52;return clamp(Math.round(o.pat/(yr*3)*100),6,100);}
const campCostP=p=>nice(Math.max(400,wageRef(p.ovr,club(p)?club(p).lg:0)*.6));
const planCost=p=>nice(Math.max(2000,(p.wage||wageRef(p.ovr,0)*.5)*4));
function folCh(o,pct){o.fol=Math.max(200,Math.round(o.fol*(1+pct/100)));return['Seguidores '+(pct>0?'+':'')+pct+'%',pct>0?'good':'bad'];}

/* ---------- semana ---------- */
function offWeek(){let inc=0;const mon=ymd(G.d).dd<=7;G.alumni=G.alumni||[];
  G.clients.forEach(id=>{const p=G.P[id];if(!p)return;const o=offOf(p),c=club(p),busy=G.events.some(e=>e.pid===id);
    /* redes */
    const T=folTarget(p,o);o.fol+=(T-o.fol)*(T>o.fol?.05:.012);
    G.wlog.forEach(g=>{if(g.pid===id&&(g.ng||g.rt>=8))o.fol*=1+.008*(g.ng||0)+(g.rt>=8?.008:0);});
    o.fol=Math.max(200,Math.round(o.fol));if(o.sm==='pol')p.fame=clamp(p.fame+.12,0,100);
    /* finanças */
    const net=(c?p.wage:0)*(1-(p.comm||0)/100)*.72,tgt=net*spRate(p,o),dry=net<=0&&o.pat<=0;o.ls+=(tgt-o.ls)*(tgt>o.ls?.08:dry?.1:.02);
    /* sem salário e sem reserva ninguém empresta: a dívida só cresce para quem ganha e gasta mais do que ganha */
    const spend=dry?0:Math.max(Math.min(150,net+Math.max(0,o.pat)),o.ls)+(o.pat>0?o.pat*.0003:0);
    const y=o.pat>0?o.pat*(o.fp==='con'?.001:o.fp==='arr'?.0022+rnd(-.012,.012):.0003):dry?0:o.pat*.004;
    let fee=0;if(o.fp!=='no'&&o.pat>0){fee=o.pat*.00025;inc+=fee;}
    o.pat=Math.round(o.pat+net-spend+y-fee);o.wi=Math.round(net);o.ws=Math.round(spend);if(p.real&&o.pat<0)o.pat=0;
    if(o.pat<0){o.red=(o.red||0)+1;p.morale=clamp(p.morale-1,0,100);
      if(o.red>=6&&-o.pat>Math.max(1500,(o.wi||0)*6)&&(o.dCool||0)<=G.d&&!busy){o.dCool=G.d+140;G.events.push({type:'divida',pid:id});}}
    else o.red=0;
    if(mon){const a=pubMonth(p,o);inc+=a;o.pat+=a*4;if(o.fp!=='no'&&o.pat>(o.pat0||0))p.trust=clamp(p.trust+1,0,100);o.pat0=o.pat;}
    /* crise e viral */
    if(!busy&&(o.sCool||0)<=G.d&&!G.events.some(e=>e.pid===id)){const r=Math.random(),hot=G.wlog.some(g=>g.pid===id&&g.ng>=2);
      if(!p.real&&r<(o.sm==='pol'?.02:o.sm==='mar'?.005:.002)){o.sCool=G.d+120;G.events.push({type:'crise',pid:id,k:ri(0,2)});}
      else if(r>1-(.012+(o.sm==='pol'?.008:0)+(hot?.08:0))){o.sCool=G.d+120;G.events.push({type:'viral',pid:id,k:ri(0,2),x:ri(3,8)});}}
    /* pós-carreira */
    if(o.plan&&o.planP<100){o.planP=Math.min(100,o.planP+1.6*(p.trait==='profissional'?1.3:p.trait==='baladeiro'?.7:1)*(p.injury>0?1.4:1));
      if(o.planP>=100){news(p.name+' concluiu a preparação para a vida depois do futebol: '+PLANS[o.plan][0].toLowerCase()+'.','agencia');
        pop({k:'good',ic:'road',ti:'Pós-carreira pronto',tx:p.name+' concluiu a preparação: '+PLANS[o.plan][0].toLowerCase()+'.',ch:[['Confiança +4','good']]});p.trust=clamp(p.trust+4,0,100);}}});
  inc+=alumWeek();inc=Math.round(inc);if(inc){G.money+=inc;G.stats.earned+=inc;G.last.inc+=inc;}}
function alumWeek(){let inc=0;(G.alumni||[]).forEach(a=>{const wk=(G.d-a.since)/7;
    if((a.role==='com'||a.role==='emp')&&G.d<a.until)inc+=a.inc;
    if(a.role!=='apo')return;
    if(!a.real&&a.pat<=0&&!a.helped&&!a.asked&&wk>26&&Math.random()<.06){a.asked=1;G.events.push({type:'exajuda',al:a.id});}
    else if(a.pat>0&&a.trust>=70&&!a.ind&&wk>20&&Math.random()<.04){a.ind=1;const nat=NAMES[a.nat]?a.nat:'BR',ovr=ri(52,62);
      const k=newPlayer({name:genName(nat),nat,pos:pick(POS),age:ri(15,18),ovr,pot:ri(Math.max(72,ovr+6),90),ag:-1,potErr:Math.max(2,8-2*G.staff.olheiro-G.me.olh),potOff:rnd(-.8,.8),found:G.d,region:'Indicação de '+a.n,obs:0});
      G.prospects.push(k.id);news('Seu ex-cliente '+a.n+' ligou para indicar um garoto: '+k.name+', '+POSN[k.pos]+' de '+k.age+' anos. Veja em Olheiros.','agencia');}});
  return inc;}
/* cliente que para vira ex-cliente; o destino depende da escolha na despedida e do plano concluído */
function alumAdd(p,c){G.alumni=G.alumni||[];const o=offOf(p),rdy=o.plan&&o.planP>=100&&o.plan!=='tec';
  let role=o.exit===2?'olh':o.exit===3?'tec':rdy?o.plan:'apo';if(role==='emp'&&o.pat<=0)role='apo';
  const a={id:G.nid++,n:p.name,pos:p.pos,age:p.age,y:ymd(G.d).y,role,pat:o.pat,fame:Math.round(p.fame),trust:Math.round(p.trust||0),real:p.real?1:0,nat:p.nat,cn:c?c.n:'',since:G.d,av:p.av};
  if(role==='com'){a.inc=nice(200+p.fame*p.fame*3);a.until=G.d+156*7;addRep(1);news(p.name+' estreia como comentarista. A agência cuida da imagem dele e recebe '+fmt(a.inc)+' por semana por 3 anos.','agencia');}
  if(role==='emp'){a.inc=nice(o.pat*.0004);a.until=G.d+260*7;addRep(.5);news(p.name+' abriu uma empresa com o que guardou na carreira. Você entrou de sócio: '+fmt(a.inc)+' por semana por 5 anos.','agencia');}
  if(role==='dir'){const cl=c||pick(clubsOf(0));cl.exd=G.d+208*7;a.until=cl.exd;a.cn=cl.n;addRep(1);news(p.name+' assumiu um cargo na diretoria do '+cl.n+'. Esse clube atende você com mais boa vontade pelos próximos 4 anos.','agencia');}

EV.divida=function(e){const p=G.P[e.pid],o=offOf(p),c=club(p),debt=Math.max(500,-o.pat),pay=nice(debt*1.05),lc=G.staff.advogado?0:nice(Math.max(500,debt*.08));

  if(w<=p.injury)return;p.injury=w;p.injT=t[0];G.injN=(G.injN||0)+1;
  if(t[1]>=26){p.ovr=Math.max(40,p.ovr-(p.age>=28?2:1));if(p.pot>p.ovr+1)p.pot--;}

/* ---------- elenco equilibrado: limite por posição ---------- */
const POS_MAX={GOL:4,ZAG:6,LAT:6,VOL:5,MEI:6,ATA:7};
const POSPL={GOL:'goleiros',ZAG:'zagueiros',LAT:'laterais',VOL:'volantes',MEI:'meias',ATA:'atacantes'};
/* o limite vale para o elenco profissional (acima de 20 anos); a garotada fica no sub-20 e não ocupa vaga */
const posCnt=(c,pos)=>squad(c.id).filter(p=>p.pos===pos&&p.age>20).length;
const roomFor=(c,pos)=>posCnt(c,pos)<POS_MAX[pos]&&squad(c.id).length<32;
/* para o seu cliente: garoto de até 20 anos sempre cabe (vai para a base), e quem é melhor que o pior da posição também (o clube cede o excedente) */
function clientRoom(c,p){if(p.age<=20||posCnt(c,p.pos)<POS_MAX[p.pos])return true;const w=squad(c.id).filter(x=>x!==p&&x.pos===p.pos&&x.age>20).reduce((m,x)=>Math.min(m,x.ovr),99);return p.ovr>=w+2;}
/* quem sobra sai como no mercado real: jovem vai emprestado, o resto é vendido barato; só sem comprador fica livre */
function moveOut(c,p){const z=zoneOf(c);
  if(p.age<=22){const end=regOf(c)==='eu'?alignCE(curMonth(),'eu'):Math.floor(curMonth()/12)*12+11;
    if(p.ce>=end){const ds=G.clubs.filter(d=>d.id!==c.id&&!isOwn(d)&&roomFor(d,p.pos)&&prest(d)<prest(c)&&(d.cn===c.cn||zoneOf(d)===z)&&p.ovr>=teamStr(d.id)-6);
      const d=wpick(ds,d=>(d.cn===c.cn?1:.3)/(1+Math.abs(p.ovr-teamStr(d.id))));if(d){p.loan={from:c.id,opt:false,fee:0,end};doTransfer(p,d,0,'empréstimo');return;}}}
  const fee=nice(value(p)*rnd(.55,.85));
  const ds=G.clubs.filter(d=>d.id!==c.id&&!isOwn(d)&&roomFor(d,p.pos)&&d.bud>=fee&&p.ovr>=starterOvr(d.id,p.pos)-4&&p.ovr<=teamStr(d.id)+5&&fitW(d,p)>.05);
  const d=wpick(ds,d=>fitW(d,p));if(d){doTransfer(p,d,fee,'');return;}
  setClub(p,null);p.wage=0;p.freeSince=curMonth();}
function shedOne(c,pos,skip){const a=squad(c.id).filter(x=>x!==skip&&(pos==null||x.pos===pos)&&x.ag!==0&&!x.loan&&!inTour(x)&&!(x.movedW&&G.d-x.movedW<Math.max(200,minStay(x)*.8))&&!(x.ovr>=78&&x.ovr>=starterOvr(c.id,x.pos)-4)&&!(x.gen&&x.age<=17)).sort((a,b)=>a.ovr-b.ovr||b.age-a.age)[0];
  if(a){moveOut(c,a);return true;}return false;}
function shedAfterBuy(c,np){if(posCnt(c,np.pos)>POS_MAX[np.pos])shedOne(c,np.pos,np);else if(squad(c.id).length>30)shedOne(c,null,np);}
function trimSquad(c){for(let k=0;k<3;k++){let worst=null,wx=0;POS.forEach(pos=>{const x=posCnt(c,pos)-POS_MAX[pos];if(x>wx){wx=x;worst=pos;}});
  if(worst){if(!shedOne(c,worst))break;}else if(squad(c.id).length>30){if(!shedOne(c,null))break;}else break;}}

  const y=ymd(G.d).y,GR={ATA:.42,MEI:.22,VOL:.08,LAT:.06,ZAG:.05,GOL:0},AR={MEI:.3,ATA:.2,LAT:.15,VOL:.1,ZAG:.03,GOL:0};
  allP().forEach(p=>{if(p.age>20||p.club==null||p.injury>0||(p.wkg||0)>0||!played.has(p.club))return;const c=G.clubs[p.club],df=p.ovr-(c.str-13);
    const gf=poisson(1.4*Math.exp(df/30)),ga=poisson(1.2*Math.exp(-df/30)),g=Math.min(gf,poisson(GR[p.pos]*Math.exp(df/14))),a=Math.min(gf-g,poisson(AR[p.pos]*Math.exp(df/14)));
    let rt=6.3+df*.06+rnd(-.8,.8)+g*.8+a*.4+(gf>ga?.2:gf<ga?-.2:0);if(ga===0&&(p.pos==='GOL'||p.pos==='ZAG'))rt+=.4;rt=clamp(Math.round(rt*10)/10,4,10);
    let u=p.u20;if(!u||u.y!==y)u=p.u20={y,ap:0,gl:0,as:0,rs:0,lr:[]};u.ap++;u.gl+=g;u.as+=a;u.rs+=Math.round(rt*10);u.lr.push(Math.round(rt*10));if(u.lr.length>5)u.lr.shift();p.wkg=1;
    if(p.ag!==0)return;const opp=pick(clubsOf(c.lg).filter(x=>x.id!==c.id))||c;
    G.wlog.push({pid:p.id,d:d0+5,cs:'Sub-20',oppN:'Sub-20 do '+opp.n,home:Math.random()<.5,gf,ga,rt,ng:g,na:a,sub:false,u20:1});
    const av=u.lr.reduce((s,x)=>s+x,0)/u.lr.length/10;

/* ================= CALENDÁRIO DO PAINEL =================
   Mês em grade (segunda a domingo). Pontos marcam jogos dos seus clientes, do seu clube, datas FIFA, torneios,
   janelas abrindo ou fechando, fim de contrato e do seu curso. As faixas embaixo de cada dia mostram janela aberta
   na Europa (azul) e no Brasil (verde). Tocar num dia mostra o que acontece nele. */
const CALK={jogo:['Jogo de cliente','gold'],own:['Jogo do seu clube','purple'],fifa:['Seleções','rose'],tour:['Torneio','rose'],gala:['Prêmios','gold'],win:['Janela','warn'],ctr:['Contrato','bad'],cur:['Curso','teal']};
function calData(d1,d2){const m={},add=(d,k,t)=>{if(d<d1||d>d2)return;(m[d]||(m[d]=[])).push({k,t});};
  G.clients.forEach(id=>{const p=G.P[id],c=club(p);if(!c)return;
    fixturesOf(c.id,d1,d2).forEach(f=>{const o=f.m?G.clubs[f.m[0]===c.id?f.m[1]:f.m[0]]:null;
      add(f.d,'jogo',p.name+': '+c.n+(o?(f.m[0]===c.id?' x ':' @ ')+o.n:'')+' · '+f.c.sh+(f.st?' ('+f.st.toLowerCase()+')':'')+(f.m&&f.m[2]>=0?' · '+f.m[2]+'–'+f.m[3]:''));});
    if(!p.loan){const y=Math.floor(p.ce/12),mo=p.ce%12+1,ld=Math.round((Date.UTC(y,mo,0)-D0)/DAY);add(ld,'ctr','Acaba o contrato de '+p.name+' com o '+c.n);}});
  if(G.own){const c=ownC();fixturesOf(c.id,d1,d2).forEach(f=>{const o=f.m?G.clubs[f.m[0]===c.id?f.m[1]:f.m[0]]:null;add(f.d,'own',c.n+(o?(f.m[0]===c.id?' x ':' @ ')+o.n:'')+' · '+f.c.sh+(f.m&&f.m[2]>=0?' · '+f.m[2]+'–'+f.m[3]:''));});}
  if(G.me.course)add(G.me.course.end,'cur','Termina o seu curso: '+COURSE_N[G.me.course.sk][G.me[G.me.course.sk]]);
  for(let d=d1;d<=d2;d++){const t=ymd(d),md=t.m*100+t.dd;
    if(FIFA_D.some(x=>x[0]*100+x[1]===md))add(d,'fifa','Data FIFA: convocações e dois jogos das seleções');
    const tn=TOURS(t.y).map(x=>x.n).join(' e ');if(tn){if(md===601)add(d,'tour','Saem as listas de convocados para '+tn);if(md===614)add(d,'tour','Começa a '+tn);if(md===712)add(d,'tour','Final da '+tn);}
    if(md===1026)add(d,'gala','Gala da Bola de Ouro');
    [['eu','Europa'],['sa','Brasil']].forEach(([r,n])=>{const a=winOpen(r,d),b=winOpen(r,d-1);if(a&&!b)add(d,'win','Abre a janela de transferências: '+n);if(a&&!winOpen(r,d+1))add(d,'win','Último dia da janela de transferências: '+n);});}
  return m;}
function vCal(){const cm=ui.calM!=null?ui.calM:curMonth(),y=Math.floor(cm/12),mo=cm%12+1,d1=dayOf(y,mo,1),d2=dayOf(y,mo+1,1)-1,data=calData(d1,d2),off=(ymd(d1).w+6)%7;
  let sel=ui.calSel;if(sel==null||sel<d1||sel>d2){sel=null;for(let d=Math.max(d1,G.d);d<=d2;d++)if(data[d]){sel=d;break;}if(sel==null)sel=Math.max(d1,Math.min(G.d,d2));}
  let cells='';for(let i=0;i<off;i++)cells+='<span class="cd pad"></span>';
  for(let d=d1;d<=d2;d++){const ev=data[d]||[],ks=[...new Set(ev.map(e=>e.k))].slice(0,4),wk=d>=G.d&&d<G.d+7,past=d<G.d;
    cells+='<button class="cd'+(wk?' wk':'')+(past?' past':'')+(d===sel?' sel':'')+'" data-a="calday" data-d="'+d+'" aria-label="'+fdate(d,true)+(ev.length?', '+ev.length+' evento(s)':'')+'"><b>'+ymd(d).dd+'</b><span class="dts">'+ks.map(k=>'<i class="dt '+CALK[k][1]+'"></i>').join('')+'</span>'+
     '<span class="wbar">'+(winOpen('eu',d)?'<i class="weu"></i>':'')+(winOpen('sa',d)?'<i class="wsa"></i>':'')+'</span></button>';}
  const se=data[sel]||[];
  const up=[];const nd=calData(G.d,G.d+75);Object.keys(nd).map(Number).sort((a,b)=>a-b).forEach(d=>nd[d].forEach(e=>{if(e.k!=='jogo'&&e.k!=='own'&&up.length<4)up.push([d,e]);}));
  return'<section class="card c-teal calc">'+cardH('clock','Calendário','<div class="calnav"><button class="btn sm" data-a="calm" data-v="-1" aria-label="Mês anterior">‹</button><b>'+MES[mo-1]+' '+y+'</b><button class="btn sm" data-a="calm" data-v="1" aria-label="Próximo mês">›</button></div>')+
   '<p class="small muted">Os pontos mostram o tipo de evento. Toque num dia para ver os detalhes.</p><div class="calg">'+['seg','ter','qua','qui','sex','sáb','dom'].map(w=>'<span class="cw">'+w+'</span>').join('')+cells+'</div>'+
   '<div class="calleg"><span><i class="weu"></i>Janela Europa</span><span><i class="wsa"></i>Janela Brasil</span>'+Object.entries(CALK).filter(([k])=>k!=='own'||G.own).filter(([k])=>k!=='tour').map(([k,v])=>'<span><i class="dt '+v[1]+'"></i>'+v[0]+'</span>').join('')+'</div>'+
   '<div class="calsel"><span class="lbl">'+fdate(sel,true)+'</span>'+(se.length?se.map(e=>'<div class="cev"><i class="dt '+CALK[e.k][1]+'"></i><span>'+esc(e.t)+'</span></div>').join(''):'<p class="small muted">Nada marcado neste dia.</p>')+'</div>'+
   (up.length?'<div class="calsel"><span class="lbl">Próximas datas</span>'+up.map(([d,e])=>'<div class="cev"><i class="dt '+CALK[e.k][1]+'"></i><span><b>'+fdate(d)+'</b> · '+esc(e.t)+'</span></div>').join('')+'</div>':'')+'</section>';}

function tryoutClubs(p){return G.clubs.filter(c=>!isOwn(c)&&clientRoom(c,p)&&(p.age>=18||c.cn===natName(p))&&(p.age<=20?p.pot>=teamStr(c.id)-6&&p.ovr>=teamStr(c.id)-24:p.ovr>=teamStr(c.id)-13))

const sgn=v=>(v>=0?'+':'-')+fmt(Math.abs(v));
function agFin(){const rec=[],exp=[];let com=0,sp=0,pub=0,ges=0;
  G.clients.forEach(id=>{const p=G.P[id];if(!p)return;if(p.club!=null)com+=p.wage*(p.comm||0)/100*fxMul(club(p));const o=p.off;
    if(o){(o.sp||[]).forEach(s=>{if(s.until>G.d)sp+=s.w*SP_CUT;});pub+=pubMonth(p,o)/4.33;if(o.fp!=='no'&&o.pat>0)ges+=o.pat*.00025;}});
  rec.push(['Comissão sobre os salários dos clientes',com],['Patrocínios dos clientes (15%)',sp],['Publis nas redes (média semanal)',pub],['Taxa de gestão financeira',ges]);
  if(G.inv){const c=G.clubs[G.inv.cid];rec.push(['Dividendos das ações do '+c.n,wageBill(c)*.05*G.inv.pct/100]);}
  if(G.pol&&G.pol.rk===3)rec.push(['Salário de diretor do '+G.clubs[G.pol.cid].n,dirPay(G.clubs[G.pol.cid])]);
  bizFinPush(rec,exp);rec.push(['Ex-clientes (imagem e sociedade)',(G.alumni||[]).filter(a=>(a.role==='com'||a.role==='emp')&&G.d<a.until).reduce((s,a)=>s+a.inc,0)]);
  let st=0;STAFF.forEach(s=>st+=STAFF_WAGE[G.staff[s.id]]);const mul=mind('est')?1.1:1;
  exp.push(['Custo do patamar ('+lvl().n+')',lvl().cost*mul],['Manutenção do escritório',offUpkeep()*mul],['Salários da equipe',st*mul]);
  if(G.pol&&G.pol.rk<3)exp.push(['Mensalidade de sócio do '+G.clubs[G.pol.cid].n,polDue(G.clubs[G.pol.cid])]);
  const R=rec.map(x=>[x[0],Math.round(x[1])]).filter(x=>x[1]>0),X=exp.map(x=>[x[0],Math.round(x[1])]).filter(x=>x[1]>0),ti=R.reduce((s,x)=>s+x[1],0),te=X.reduce((s,x)=>s+x[1],0);
  return{R,X,ti,te,net:ti-te};}

function finLog(d0){const f=G.fin||(G.fin={h:[]}),fixo=G.last.inc-G.last.exp,tot=f.mEnd!=null?G.money-f.mEnd:fixo;

function mFin(){const f=agFin(),mx=Math.max(1,...f.R.map(x=>x[1]),...f.X.map(x=>x[1])),h=(G.fin&&G.fin.h)||[],run=f.net<0&&G.money>0?Math.floor(G.money/-f.net):null;

const YC={GOL:.04,ZAG:.19,LAT:.15,VOL:.21,MEI:.12,ATA:.1};
function cardsFor(p,s,sub){if(!sub)s[8]=(s[8]||0)+1;const m=sub?.35:1,y=Math.random()<YC[p.pos]*m,r=Math.random()<.007*m||(y&&Math.random()<.04);

  if(r){s[7]=(s[7]||0)+1;const w=Math.random()<.3?2:1;p.suspTil=Math.max(p.suspTil||0,G.d+7*w);if(p.ag===0&&!G._pre)news(p.name+' foi expulso e está suspenso por '+w+' semana'+(w>1?'s':'')+'.','geral');}}
function statAgg(p,k){if(k==='u20'){const u=p.u20||{ap:0,gl:0,as:0,rs:0};return{ap:u.ap,gs:u.ap,gl:u.gl,as:u.as,yc:0,rc:0,avg:u.ap?u.rs/u.ap/10:0};}

/* ---- fx.js ---- */
/* ================= MOEDAS: REAL, EURO E DÓLAR =================
   O caixa da agência, as empresas e o futebol brasileiro ficam em real. Valores de clubes europeus aparecem em euro
   e os dos outros clubes da América do Sul em dólar, pela paridade fixa do jogo (R$ 6 por euro, R$ 5,50 por dólar).
   O câmbio real oscila toda semana: o que um clube da Europa paga em euro entra no caixa convertido pela cotação do dia. */
const FX0={EUR:6,USD:5.5};
const curOf=c=>!c?'BRL':regOf(c)==='eu'?'EUR':c.cn==='Brasil'?'BRL':'USD';
const curOfP=p=>curOf(club(p));
function inCur(cur,fn){const o=CURX;CURX=cur==='BRL'?null:cur;try{return fn();}finally{CURX=o;}}
const fmtC=(v,c)=>inCur(curOf(c),()=>fmt(v));
function fxNow(){return G.fx||(G.fx={eur:6,usd:5.5});}
function fxMul(c){const x=fxNow(),k=curOf(c);return k==='EUR'?x.eur/FX0.EUR:k==='USD'?x.usd/FX0.USD:1;}
const f2=v=>v.toFixed(2).replace('.',',');
function fxWeek(){const x=fxNow(),e0=x.eur;x.eur=clamp(x.eur+(FX0.EUR-x.eur)*.03+x.eur*rnd(-.009,.009),5.2,7);x.usd=clamp(x.eur/(1.09+rnd(-.006,.006)),4.7,6.5);
  if(ymd(G.d).dd<=7){const m=x.m0||e0,ch=(x.eur-m)/m;if(Math.abs(ch)>=.03)news('Câmbio: o euro '+(ch>0?'subiu':'caiu')+' '+Math.round(Math.abs(ch)*100)+'% no mês e está a R$ '+f2(x.eur)+'. '+(ch>0?'Comissões de clubes da Europa rendem mais em real.':'Comissões de clubes da Europa rendem menos em real.'),'geral');x.m0=x.eur;}}
function negCur(){return G.neg?curOf(G.clubs[G.neg.cid]):'BRL';}

function momTrack(){G.clients.forEach(id=>{const p=G.P[id];if(!p)return;const c=club(p),gs=G.wlog.filter(x=>x.pid===id&&!x.u20);
  p.fm=(p.fm||[]).concat(gs.map(x=>x.rt)).slice(-5);if(c&&!gs.length&&!G.wlog.some(x=>x.pid===id)&&(p.fm.length))p.fmIdle=(p.fmIdle||0)+1;else p.fmIdle=0;if(p.fmIdle>=4){p.fm=[];p.fmIdle=0;}
  p._best=gs.reduce((m,x)=>Math.max(m,x.rt),0);
  if(p.injury>0)p._injN=(p._injN||0)+1;else{p._inj=p._injN||0;p._injN=0;}
  if(!c)p._cn=null;});}
function momAfter(){G.clients.forEach(id=>{const p=G.P[id];if(!p)return;const c=club(p);if(p._inj)p._inj=0;p._cn=c?c.coach.n:null;});}
function rollMoment(){const cand=[];G.clients.forEach(id=>{const p=G.P[id];if(!p||(p.evCool||0)>G.d)return;const c=club(p);
  for(const k in MOM){const m=MOM[k];if((G.cd['m'+k]||0)>G.d||recentT('m'+k))continue;let ok=false;try{ok=m.q(p,c);}catch(e){}if(ok)cand.push({k,p,w:m.w});}});
  const x=wpick(cand,o=>o.w);if(!x)return false;G.cd['m'+x.k]=G.d+56;x.p.evCool=G.d+14;G.events.push({type:'mom',k:x.k,pid:x.p.id,x:x.k==='volta'?x.p._inj:x.k==='gala'?x.p._best:0});noteT('m'+x.k);return true;}
/* memória dos últimos tipos de decisão para não repetir em sequência */
function noteT(t){G.decT=(G.decT||[]).concat(t).slice(-6);}

  const gap=(G.decGap||0);let pr=.36+Math.min(.45,gap*.14);if(G.clients.length>=6)pr+=.08;
  if(!G.events.length&&(gap>=4||Math.random()<pr)){
    const r=Math.random();
    if(r<.5)rollMoment();
    if(!G.events.length&&Math.random()<.15){const ev=legacyEvent2(G.P[pick(G.clients)]);if(ev){G.events.push(ev);noteT(ev.type);}}
    if(!G.events.length)for(let i=0;i<6&&!G.events.length;i++)rollRandom(i>3);
    if(!G.events.length)rollMoment();}
  momAfter();
  G.decGap=G.events.length?0:gap+1;}
