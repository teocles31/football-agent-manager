/* ================= TÉCNICOS DAS SELEÇÕES MUDAM =================
   A federação demite depois de uma sequência ruim nas datas FIFA, de um torneio abaixo do esperado ou no fim de um ciclo longo.
   O substituto vem, de preferência, de um clube do próprio país que esteja em boa fase; o clube contrata outro técnico. */
function ntCo(n){const o=G.ntCo&&G.ntCo[n];if(o)return[o.n,o.from,0];return NT_C[n];}
function ntCoSince(n){G.ntCoS=G.ntCoS||{};if(G.ntCoS[n]==null)G.ntCoS[n]=G.d-ri(120,1100);return G.ntCoS[n];}
function ntRecOld(n,gf,ga){G.ntF=G.ntF||{};G.ntF[n]=((G.ntF[n]||'')+(gf>ga?'V':gf<ga?'D':'E')).slice(-8);}
const ntInterim=n=>{const c=ntCo(n);return!!(c&&/interino/.test(c[0]));};
function ntCandidates(n){const out=[];G.clubs.forEach(c=>{if(c.cn!==n||!c.coach||isOwn(c))return;const k=c.coach,pos=leaguePos(c.id),L=curLeague(c.lg),sz=L?Object.keys(L.tab).length:20;
    const wins=(c.fm||'').split('').filter(x=>x==='V').length,loss=(c.fm||'').split('').filter(x=>x==='D').length;
    const good=(pos!=null?pos<=Math.max(5,Math.round(sz*.35)):true)&&loss<=2&&(G.d-(k.since||0))>=70;
    if(good)out.push({c,k,sc:k.r+(pos!=null?(sz-pos)*.6:0)+wins*1.5+(k.real?2:0)});});
  return out.sort((a,b)=>b.sc-a.sc);}
function ntSack(n,why){if(G._pre)return;const old=ntCo(n);if(!old)return;const cand=ntCandidates(n);let nw,from;
  if(cand.length){const x=wpick(cand.slice(0,3),y=>y.sc-60)||cand[0],c=x.c,k=x.k;nw=k.n;from='ex-'+c.n;
    const rep=ntClubReplace(c,old);G.fc=(G.fc||[]).filter(y=>y!==k);
    news(c.n+' perde o técnico para a seleção: '+k.n+' sai e '+rep.n+' assume o clube.','liga');
    G.clients.forEach(id=>{const p=G.P[id];if(p&&p.club===c.id)news(p.name+' vai ter técnico novo no '+c.n+': '+rep.n+' chega no lugar de '+k.n+'.','agencia');});}
  else{const tg=ntXI(G.nt.sq[n]||[]).str+2,zn=n==='Brasil'?'BR':confOf(n)==='SA'?'SA':'EU',fc=(G.fc||[]).filter(k=>k.r<=tg+3&&(COACH_W[zn][k.ng||'EU']||0)>=.25).sort((a,b)=>Math.abs(a.r-tg)-Math.abs(b.r-tg)).slice(0,5),k=fc.length?pick(fc):null;if(k){nw=k.n;from='estava sem clube';G.fc.splice(G.fc.indexOf(k),1);}else return;}
  /* o demitido vira opção para os clubes */
  if(!ntHiredOld){const z=G.clubs.find(c=>c.cn===n)||G.clubs[0],fk=newCoach(78,z);fk.n=old[0].replace(/ \(interino\)/,'');fk.real=1;(G.fc=G.fc||[]).push(fk);}ntHiredOld=false;
  (G.ntCo=G.ntCo||{})[n]={n:nw,from};(G.ntCoS=G.ntCoS||{})[n]=G.d;if(G.ntF)G.ntF[n]='';
  news('Seleção ('+n+'): '+old[0]+' deixa o cargo '+why+'. '+nw+' ('+from+') é o novo técnico.','selecao');
  if(n===HOME_NT)pop({k:'info',ic:'flag',ti:'Técnico novo na seleção',tx:nw+' ('+from+') assume o Brasil no lugar de '+old[0]+'.'});}
function ntReview(){if(G._pre||!G.nt)return;ntList().forEach(n=>{const f=(G.ntF&&G.ntF[n])||'',l6=f.slice(-6),L=l6.split('').filter(x=>x==='D').length,W=l6.split('').filter(x=>x==='V').length,yrs=(G.d-ntCoSince(n))/365;
  if(ntInterim(n)&&Math.random()<.6)return ntSack(n,'ao fim do período como interino');
  if(yrs>=1&&l6.length>=6&&L>=4&&W<=1&&Math.random()<.3)return ntSack(n,'depois de '+L+' derrotas nos últimos '+l6.length+' jogos');});}
function ntReviewTour(T){if(G._pre)return;const r0=(G.nt.r0)||{},R=G.nt.rank,big=T.k==='WC';Object.keys(T.sq||{}).forEach(n=>{if(n===T.win||!NT_C[n]&&!(G.ntCo&&G.ntCo[n]))return;
  const drop=(r0[n]||R[n])-R[n],yrs=(G.d-ntCoSince(n))/365,top=ntList().indexOf(n)<16;
  if(drop>=25&&top&&Math.random()<(big?.65:.45))return ntSack(n,'após a campanha fraca na '+T.name+' '+T.Y);
  if(big&&yrs>=3.5&&Math.random()<.4)return ntSack(n,'no fim do ciclo depois da '+T.name+' '+T.Y);});}

/* técnico da divisão de acesso vira opção para clubes do mesmo país que buscam alguém do nível dele */
function mkCoach(s,c){if(c&&G&&G.clubs&&!G._pre&&s<=76&&Math.random()<.35){const pool=accInit().filter(a=>a.cn===c.cn&&a.r>=s-7&&a.r<=s+2&&!coachUsed().has(a.n));
    if(pool.length){const a=pick(pool),k=newCoach(a.r,c);k.n=a.n;k.ng=a.ng;k.r=a.r;k.real=1;k.acc=a.cl+' ('+a.lg+')';G.acc.splice(G.acc.indexOf(a),1);
      news(c.n+' busca técnico na '+a.lg+': '+a.n+', que estava no '+a.cl+', assume o comando.','liga');return k;}}
  return mkCoach0(s,c);}

function ntClubReplace(c,old){const z=coachZone(c),oz=zoneOfNat(old[1]||'');
  /* raro: o técnico que saiu da seleção vai direto para o clube */
  if(Math.random()<.1&&(COACH_W[z][oz]||0)>=.25){const k=newCoach(78,c);k.n=old[0].replace(/ \(interino\)/,'');k.ng=oz;k.real=1;swapCoach(c,k);ntHiredOld=true;return k;}
  /* efeito dominó curto: tira o técnico de um clube menor do país em boa fase; esse clube contrata alguém livre ou da divisão de acesso */
  if(Math.random()<.3){const sc=teamStr(c.id),d=pick(G.clubs.filter(x=>x!==c&&x.cn===c.cn&&!isOwn(x)&&x.coach&&teamStr(x.id)<sc-2&&(G.d-(x.coach.since||0))>=70&&(leaguePos(x.id)==null||leaguePos(x.id)<=8)&&(x.fm||'').split('').filter(y=>y==='D').length<=2));
    if(d){const k=d.coach,r2=mkCoach(teamStr(d.id)-1,d);swapCoach(d,r2);G.fc=(G.fc||[]).filter(y=>y!==k);swapCoach(c,k);
      news('Efeito dominó: o '+c.n+' tira '+k.n+' do '+d.n+', que contrata '+r2.n+'.','liga');
      G.clients.forEach(id=>{const p=G.P[id];if(p&&p.club===d.id)news(p.name+' vai ter técnico novo no '+d.n+': '+r2.n+'.','agencia');});return k;}}
  const r=mkCoach(teamStr(c.id)-1,c);swapCoach(c,r);return r;}

function uiFresh(){ui.modal=null;ui.stack=[];ui.pm=ui.pr=ui.lastTab=null;ui.tab='painel';ui.dlg=null;ui.comp=null;ui.figOpen={};ui.offOpen={};ui.calOpen=false;ui.slotDel=null;}
const TNS=['Empresário de várzea','Agente regional','Agente nacional','Agente internacional','Superagente'];
function slotCard(n,inGame){const m=slotMeta(n),cur=n===curSlot()&&!!G,del=ui.slotDel===n;
  if(!m)return'<div class="slot empty"><div class="slot-n">'+n+'</div><div class="grow"><b>Espaço livre</b><span class="small muted">Comece uma carreira nova aqui.</span></div><button class="btn pri" data-a="slotnew" data-n="'+n+'">Nova carreira</button></div>';
  const top='<div class="slot'+(cur?' cur':'')+'"><div class="slot-n">'+n+'</div><div class="grow"><b>'+esc(m.a||'Agência')+'</b><span class="small muted">'+esc(TNS[m.t]||'')+' · reputação '+Math.floor(m.rep||0)+' · '+m.cl+' cliente'+(m.cl===1?'':'s')+(m.own?' · dono de clube':'')+'</span><span class="small muted">Jogo em '+fdate(m.d,true)+' · caixa '+fmt(m.m||0)+'</span></div>';
  if(del)return top+'<div class="slot-a"><span class="small nok">Apagar de vez? Não dá para desfazer.</span><button class="btn danger" data-a="slotdelok" data-n="'+n+'">Apagar</button><button class="btn" data-a="slotdel" data-n="0">Cancelar</button></div></div>';
  return top+'<div class="slot-a">'+(cur?'<span class="chip good">Jogando agora</span>':'<button class="btn pri" data-a="slotgo" data-n="'+n+'">'+(inGame?'Trocar para esta':'Continuar')+'</button>')+'<button class="btn ghost" data-a="slotdel" data-n="'+n+'">Apagar</button></div></div>';}
function mSlots(inGame){return'<div class="sheet slots"><span class="eyebrow">Football Agent Manager</span><h2>Suas carreiras</h2><p class="small muted">Até 3 carreiras ao mesmo tempo. O jogo salva sozinho a cada ação; cada carreira fica guardada neste aparelho.</p>'+
  [1,2,3].map(n=>slotCard(n,inGame)).join('')+
  (inGame?'<div class="acts"><button class="btn" data-a="faces">Pack de faces</button><button class="btn" data-a="slotsave">Salvar agora</button><button class="btn" data-a="close">Voltar ao jogo</button></div>':'')+'</div>';}

  slots(){ui.slotDel=null;ui.stack=[];ui.modal={type:'slots'};render();},

function xiOf(cid){const av=squad(cid).filter(p=>!p.injury&&!(p.boost<0)&&!p.lent&&!((p.suspTil||0)>G.d));const sc=p=>p.ovr+(p.boost>0?30:0)-(p.adapt>0?4:0)-(p.fat||0)*1.6;
  const by={};av.forEach(p=>(by[p.pos]||(by[p.pos]=[])).push(p));Object.values(by).forEach(a=>a.sort((x,y)=>sc(y)-sc(x)));
  const xi=[];for(const pos in FORM){const a=by[pos]||[];for(let i=0;i<FORM[pos];i++)if(a.length)xi.push(a.shift());}
  const rest=Object.values(by).flat().filter(p=>p.pos!=='GOL').sort((x,y)=>sc(y)-sc(x));while(xi.length<11&&rest.length)xi.push(rest.shift());return xi;}
const shortN=n=>{const w=String(n).split(' ');if(w.length<2||n.length<=13)return n;const l=w[w.length-1];return/^(Junior|Júnior|Jr.?|Filho|Neto|Sobrinho)$/i.test(l)?w[0]+(/^J/i.test(l)?' Jr.':''):l;};

  const lat=by.LAT||[],zag=by.ZAG||[],def=[lat[0],...zag,lat[1]].filter(Boolean);
  const used=new Set([...def,...(by.GOL||[]).slice(0,1)].map(p=>p.id));
  const rows=[['ATA',(by.ATA||[])],['MEI',(by.MEI||[])],['VOL',(by.VOL||[])],['DEF',def],['GOL',(by.GOL||[]).slice(0,1)]];
  const slot=p=>'<div class="pt-p'+(isClient(p)?' mine':'')+'">'+avatar(p,34)+'<span class="pt-o">'+p.ovr+'</span><b><button class="lnk" data-a="player" data-p="'+p.id+'">'+esc(shortN(p.name))+'</button></b><span class="pt-pos">'+p.pos+'</span></div>';
  return'<div class="pitch"><span class="pt-lbl">'+esc(lbl||'Titulares hoje · 4-2-2-2')+'</span><i class="pt-mid"></i><i class="pt-box t"></i><i class="pt-box b"></i>'+rows.filter(r=>r[1].length).map(r=>'<div class="pt-row">'+r[1].map(slot).join('')+'</div>').join('')+'</div>';}

function ntRec(n,gf,ga,o,T,d){G.ntF=G.ntF||{};G.ntF[n]=((G.ntF[n]||'')+(gf>ga?'V':gf<ga?'D':'E')).slice(-8);
  if(o==null)return;G.ntH=G.ntH||{};const h=G.ntH[n]||(G.ntH[n]=[]);h.unshift({d:d||G.d,o,gf,ga,c:T?T.sh||T.name:'Amistoso / Data FIFA'});if(h.length>10)h.length=10;}

const bizFixCost=(d,b)=>nice(d.cost*BMUL[b.lv-1]*.12*Math.max(.3,b.wear||0));
function bizWearTxt(d,b){const w=b.wear||0,pc=Math.round(Math.min(.6,.2*w)*100);return'<p class="small'+(w>=1.3?' nok':' muted')+'">Desgaste: '+(pc?'custos '+pc+'% maiores':'nenhum')+(b.lw>=4?' · <b>no vermelho há '+b.lw+' semanas</b>':'')+'</p>';}
function bizHealth(d,b,n){b.wear=(b.wear||0)+1/52;b.lw=n<0?(b.lw||0)+1:0;
  if(b.lw===8)news('A '+b.n+' está no vermelho há 2 meses. Modernize, espere o mercado melhorar ou venda.','agencia');
  if(b.lw===14&&!G.events.some(e=>e.type==='bizcrise'))G.events.push({type:'bizcrise',k:d.id});
  if(b.lw>=26){b.st='fail';const back=nice(b.inv*.1);G.money+=back;news('A '+b.n+' fechou as portas depois de seis meses de prejuízo. Sobrou '+fmt(back)+' da venda dos equipamentos.','agencia');
    pop({k:'bad',ic:'no',ti:'Empresa fechada',tx:'A '+b.n+' não aguentou o prejuízo e fechou.',ch:[['+'+fmt(back)+' de equipamentos','warn']]});}}
EV.bizcrise=function(e){const d=BIZ.find(x=>x.id===e.k),b=G.biz&&G.biz[e.k];if(!d||!b||b.st!=='ok')return{title:'Empresa',text:'O problema se resolveu.',choices:[{label:'Ok',run(){return{t:'Tudo certo.',chips:[]};}}]};
  const inj=nice(d.cost*BMUL[b.lv-1]*.3),back=nice(Math.max(b.inv*.25,bizVal(d,b)*.5));
  return{title:'Empresa no vermelho',text:'A '+b.n+' dá prejuízo há '+b.lw+' semanas. O gerente pede uma decisão antes que a dívida cresça.',choices:[
   {label:'Injetar capital e reestruturar · '+fmt(inj),sub:'Zera o desgaste e reanima as vendas.',can:G.money>=inj,run(){G.money-=inj;b.inv+=inj;b.wear=0;b.lw=0;b.mk=clamp(b.mk+.2,.45,1.4);return{t:'A '+b.n+' foi reestruturada e voltou a respirar.',chips:[['-'+fmt(inj)+' no caixa','bad']],ok:true};}},
   {label:'Fechar e vender o que der · +'+fmt(back),sub:'Para de sangrar o caixa da agência.',run(){b.st='sold';G.money+=back;news('Você fechou a '+b.n+' e recuperou '+fmt(back)+'.','agencia');return{t:'Empresa fechada.',chips:[['+'+fmt(back)+' no caixa','warn']]};}},
   {label:'Segurar mais um pouco',sub:'O mercado pode virar. Ou a empresa quebra de vez.',run(){b.mk=clamp(b.mk+rnd(-.1,.25),.45,1.4);return{t:'Você decidiu esperar.',chips:[]};}}]};};
const BIZLA={bizfix(d){const x=BIZ.find(z=>z.id===d.k),b=G.biz&&G.biz[d.k];if(!x||!b||b.st!=='ok')return;const c=bizFixCost(x,b);if(G.money<c){toast('Caixa insuficiente.');return;}
  G.money-=c;b.inv+=c;b.wear=0;b.mk=clamp(b.mk+.05,.45,1.4);pop({k:'good',ic:'build',wait:1200,wt:'Modernizando…',ti:'Empresa modernizada',tx:'A '+b.n+' trocou equipamentos e voltou a ter custos normais.',ch:[['-'+fmt(c),'bad']]});save();render();}};

function shrinkImg(file){return new Promise(res=>{try{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const S=128,cv=document.createElement('canvas');cv.width=S;cv.height=S;const x=cv.getContext('2d');
  const sc=Math.max(S/im.width,S/im.height),w=im.width*sc,h=im.height*sc;x.fillStyle='#d9dee0';x.fillRect(0,0,S,S);x.drawImage(im,(S-w)/2,Math.min(0,(S-h)*.2),w,h);res(cv.toDataURL('image/jpeg',.84));};im.onerror=()=>res(null);im.src=rd.result;};rd.onerror=()=>res(null);rd.readAsDataURL(file);}catch(e){res(null);}});}
/* casa o nome do arquivo com o jogador: nome completo, depois sobrenome ou apelido único; em empate, prefere jogador real */
function faceMatch(base){const k=faceKey(base);if(!k)return{st:'none'};const ps=allP().concat(Object.values(G.P).filter(p=>p.club==null));const seen=new Set(),uniq=ps.filter(p=>!seen.has(p.id)&&seen.add(p.id));
  let c=uniq.filter(p=>fkOf(p)===k);if(!c.length)c=uniq.filter(p=>faceKey(p.name)===k);if(!c.length)c=uniq.filter(p=>{const n=faceKey(p.name);return n.endsWith(' '+k)||n.startsWith(k+' ')||n.split(' ').includes(k);});
  if(c.length>1){const r=c.filter(p=>p.real);if(r.length)c=r;}if(c.length>1){const cl=c.filter(p=>isClient(p));if(cl.length===1)c=cl;}
  return c.length===1?{st:'ok',p:c[0]}:c.length?{st:'amb',n:c.length}:{st:'none'};}
async function faceImport(files){const res={ok:[],amb:[],none:[]};ui.faceBusy=1;render();
  for(const f of Array.from(files||[])){const base=f.name.replace(/\.[^.]+$/,''),m=faceMatch(base);if(m.st!=='ok'){res[m.st].push(base);continue;}
    const url=await shrinkImg(f);if(!url){res.none.push(base);continue;}const k=fkOf(m.p);FACES[k]=url;await FDB.put(k,url);res.ok.push(m.p.name);}
  ui.faceBusy=0;ui.faceRes=res;render();}
async function faceOne(file,pid){const p=G.P[pid];if(!p||!file)return;const url=await shrinkImg(file);if(!url){toast('Não consegui abrir essa imagem.');return;}const k=fkOf(p);FACES[k]=url;await FDB.put(k,url);toast('Foto de '+p.name+' atualizada.');render();}

/* ================= CALENDÁRIO POR RODADA: CARROSSEL COM SETAS (E ARRASTAR) ================= */
function rdCur(rs){let i=rs.findIndex(r=>!r.done);if(i<0)i=rs.length-1;else if(i>0&&rs[i].d>G.d+6)i--;return i;}
function compPages(c){const P=[],nr=(c.rounds||[]).length;(c.rounds||[]).forEach((r,i)=>P.push({t:(c.t==='L'?'Rodada ':c.t==='U'?'Fase de liga · rodada ':'Grupos · rodada ')+(i+1)+' de '+nr,d:r.d,m:r.m,done:r.done}));
  (c.ko||[]).forEach(st=>st.d.forEach((dd,l)=>P.push({t:st.n+(st.d.length>1?(l?' · volta':' · ida'):''),d:dd,m:st.ties?st.ties.map(t=>t.m[l]).filter(Boolean):null,done:st.ties?st.ties.every(t=>!t.m[l]||t.m[l][2]>=0):false})));return P;}
function roundsView(c){const rs=compPages(c);if(!rs.length)return'<div class="card"><p class="small muted">Sem jogos marcados nesta competição.</p></div>';
  const cur=rdCur(rs),i0=ui.rd!=null&&ui.rd>=0&&ui.rd<rs.length?ui.rd:cur;ui.rd=i0;
  const mine=new Set(G.clients.map(id=>G.P[id]&&G.P[id].club).filter(x=>x!=null));if(G.own)mine.add(G.own.cid);
  return'<div class="rd-car" data-rd="'+i0+'">'+rs.map((r,i)=>'<section class="rd-pg card"><div class="rd-h">'+
     '<button class="rd-arr" data-a="rdgo" data-v="-1" aria-label="Rodada anterior"'+(i===0?' disabled':'')+'>‹</button>'+
     '<div class="rd-t"><b>'+esc(r.t)+'</b><span>'+fdate(r.d,true)+(i===cur&&!r.done?' · próxima':r.done?' · encerrada':'')+'</span></div>'+
     '<button class="rd-arr" data-a="rdgo" data-v="1" aria-label="Próxima rodada"'+(i===rs.length-1?' disabled':'')+'>›</button></div>'+
     (r.m?r.m.map(m=>{const h=matchRow(m,r.d);return mine.has(m[0])||mine.has(m[1])?h.replace('<div class="mrow">','<div class="mrow mine">'):h;}).join(''):'<p class="small muted rd-empty">Sorteio depois da fase anterior.</p>')+'</section>').join('')+'</div>'+
   '<p class="small muted rd-tip">Toque nas setas ou arraste para o lado para trocar de rodada.</p>';}
function rdInit(){try{const el=document.querySelector('#view .rd-car');if(!el||!el.clientWidth||el.dataset.ok)return;el.dataset.ok=1;const i=+el.dataset.rd||0;el.scrollLeft=i*el.clientWidth;
  let t=null;el.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{ui.rd=Math.round(el.scrollLeft/el.clientWidth);},120);},{passive:true});}catch(e){}}
function render(){render0();rdInit();}
const RDA={rdgo(d){try{const el=document.querySelector('#view .rd-car');if(!el)return;const base=ui.rd!=null?ui.rd:Math.round(el.scrollLeft/el.clientWidth),i=base+(+d.v),n=el.children.length;const j=Math.max(0,Math.min(n-1,i));ui.rd=j;el.scrollTo({left:j*el.clientWidth,behavior:'smooth'});}catch(e){}}};

/* nível do estúdio: 1 libera buscar patrocinador; 2 sobe um degrau de marca; 3 sobe um degrau e melhora o contrato */
const mdL=()=>offL('midia');
const spBoost=()=>mdL()>=2?1:0;
function spPick(p,c,o,v,tm,force){const ch=o.sp.find(s=>spCat(s)==='chut'),oth=o.sp.filter(s=>spCat(s)!=='chut'),used=new Set(o.sp.map(s=>spCat(s)));let cat=null,swap=null;
  const sl=spSlots(v)+(force&&mdL()>=1?1:0);
  if(!ch)cat='chut';else if(spT(ch)>tm&&Math.random()<(force?.7:.45)){cat='chut';swap=ch;}else if(oth.length<Math.max(sl,force?1:0)){const cs=Object.keys(BRC).filter(k=>k!=='chut'&&k!=='emp'&&!used.has(k));if(cs.length)cat=pick(cs);}
  if(!cat)return null;let L=BR.filter(b=>b.cat===cat&&b.t>=tm&&(!swap||b.t<spT(swap))&&b.id!==(swap&&swap.bid));if(!L.length)return null;const best=Math.min(...L.map(b=>b.t));L=L.filter(b=>b.t===best);return{cat,swap,b:pick(L)};}
function spOffer(p,c,o,id,force){const v=mktV(p),tm=Math.max(1,spTierMax(v)-spBoost()),r=spPick(p,c,o,v,tm,force);if(!r)return false;const {cat,swap,b}=r;
  const w=nice(wageRef(p.ovr,c?c.lg:0)*(.022+v/1800)*[0,1.7,1.1,.7][b.t]*(cat==='chut'?1.35:1)*(c?1:.5)*rnd(.85,1.15)*(1+.05*bizLv('mkt'))*(mdL()>=3?1.15:1));
  const m=cat==='chut'?ri(24,48):ri(12,30),bk=['ATA','MEI'].includes(p.pos)?'gol':'jogo',bon=b.t<=2?{k:bk,v:nice(w*(bk==='gol'?.15:.1))}:null;
  o.spCd=G.d+(force?28:42);G.events.push({type:'spons2',pid:id,bid:b.id,cat,w,m,bon,swap:swap?spName(swap):null,v,md:force?1:0});return true;}
/* propostas espontâneas: as marcas procuram quem tem imagem; o estúdio de mídia aumenta a frequência */
function spGen(p,c,o,id){const v=mktV(p);o.sp=o.sp||[];if(v<22||(o.spCd||0)>G.d||G.events.some(e=>e.pid===id))return;
  if(Math.random()>(.012+v/2600)*(mind('est')?1.4:1)*(1+.1*bizLv('mkt'))*(1+.2*mdL()))return;spOffer(p,c,o,id,false);}
function spAskOk(p,o){return mdL()>=1&&mktV(p)>=15&&(o.spAsk||0)<=G.d;}
function spBlock(p,o){const h=spBlock0(p,o),v=mktV(p),L=mdL();
  const btn=L<1?'<p class="small muted spb-m">'+svgI('lock',14)+' Com o <b>Estúdio de mídia</b> no nível 1 (Agência › Escritório), você pode ir atrás de patrocinadores para '+esc(p.name.split(' ')[0])+'. Cada nível abre marcas maiores.</p>':
   '<div class="spb-m"><button class="btn sm pri" data-a="spask" data-p="'+p.id+'"'+(spAskOk(p,o)&&G.ap>=1?'':' disabled')+'>Buscar patrocinador <small>1 ação</small></button><span class="small muted">'+((o.spAsk||0)>G.d?'Nova busca em '+fdate(o.spAsk,true)+'.':v<15?'Precisa de mais fama ou nível para atrair marcas.':'Estúdio nível '+L+': '+(L>=3?'marcas um degrau acima e contratos 15% melhores.':L>=2?'marcas um degrau acima do valor de imagem.':'marcas do tamanho do valor de imagem.'))+'</span></div>';
  return h.replace(/<\/div>$/,btn+'</div>');}

function floatFx(sel,text,kind){const a=document.querySelector(sel),L=$('#fx');if(!a||!L||!a.getBoundingClientRect)return;const r=a.getBoundingClientRect();
